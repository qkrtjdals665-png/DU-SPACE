<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>디유 스페이스 - 사업 현황</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh}
.overview{max-width:1480px;margin:0 auto;padding:28px}
.overview-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;color:#0b8063;margin-bottom:7px}
.overview-head h1{font-size:28px;line-height:1.2;letter-spacing:-.045em;margin-bottom:7px}
.overview-sub{font-size:13px;color:#777771;line-height:1.55}
.month-nav{display:flex;align-items:center;gap:7px;padding:8px!important;margin:0!important;box-shadow:none!important}
.month-nav button{padding:8px 12px;border:0;cursor:pointer;font-size:12px;font-weight:650}
.month-label{min-width:112px;text-align:center;font-size:14px;font-weight:700}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{position:relative;overflow:hidden;background:#fff;border:1px solid #e3e3de;border-radius:16px;padding:20px;box-shadow:0 1px 2px rgba(24,24,22,.04),0 8px 24px rgba(24,24,22,.04)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kpi-color)}
.kpi-label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:#74746e;font-weight:620;margin-bottom:12px}
.kpi-value{font-size:27px;font-weight:760;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:#222220}
.kpi-sub{font-size:11px;color:#96968f;margin-top:7px}
.kpi.sales{--kpi-color:#2f6feb}.kpi.profit{--kpi-color:#10a37f}.kpi.spend{--kpi-color:#d94b55}.kpi.ads{--kpi-color:#805ad5}
.delta{font-size:10px;font-weight:700;padding:3px 7px;border-radius:999px;background:#f2f2ef;color:#777771}
.main-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:14px;margin-bottom:14px}
.panel{background:#fff;border:1px solid #e3e3de;border-radius:16px;padding:20px;box-shadow:0 1px 2px rgba(24,24,22,.04),0 8px 24px rgba(24,24,22,.04)}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.panel-title{font-size:15px;font-weight:700;letter-spacing:-.025em}
.panel-desc{font-size:11px;color:#92928b;margin-top:4px}
.text-link{color:#5f5f5a;text-decoration:none;font-size:11px;font-weight:650;padding:6px 9px;border-radius:8px;background:#f4f4f1}
.bridge{display:grid;gap:2px}
.bridge-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;padding:10px 3px;border-bottom:1px solid #efefeb}
.bridge-row:last-child{border:0}
.bridge-name{font-size:12px;color:#686863}
.bridge-value{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.bridge-row.minus .bridge-value{color:#c64a54}
.bridge-row.total{margin-top:5px;padding:13px 12px;background:#eef8f4;border:1px solid #d8ede5;border-radius:11px}
.bridge-row.total .bridge-name,.bridge-row.total .bridge-value{color:#087f63;font-weight:760}
.expense-list{display:grid;gap:11px}
.expense-row{display:grid;grid-template-columns:minmax(92px,1fr) minmax(120px,2.1fr) auto;align-items:center;gap:10px}
.expense-name{font-size:12px;color:#555550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.expense-track{height:7px;background:#eeeeea;border-radius:999px;overflow:hidden}
.expense-bar{height:100%;border-radius:999px;background:#d2646d}
.expense-value{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.expense-empty{padding:34px 0;text-align:center;color:#9a9a94;font-size:12px}
.platform-panel{margin-bottom:14px}
.platform-table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.platform-table th,.platform-table td{padding:11px 10px;text-align:right;border-bottom:1px solid #eeeeea}
.platform-table th{font-size:10px;color:#777771;background:#f5f5f2}
.platform-table th:first-child,.platform-table td:first-child{text-align:left}
.platform-table tbody tr:last-child td{border-bottom:0}
.platform-name{display:flex;align-items:center;gap:8px;font-weight:700}
.platform-dot{width:8px;height:8px;border-radius:50%;background:var(--dot)}
.money-positive{color:#087f63;font-weight:750}
.money-negative{color:#d14b55;font-weight:750}
.status-panel{padding-bottom:14px}
.freshness-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.freshness-item{padding:12px;background:#f7f7f5;border:1px solid #e8e8e3;border-radius:12px}
.freshness-name{font-size:11px;font-weight:700;color:#4f4f4b;margin-bottom:7px}
.freshness-date{font-size:13px;font-weight:750;font-variant-numeric:tabular-nums}
.freshness-state{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:10px;color:#85857f}
.state-dot{width:6px;height:6px;border-radius:50%;background:#10a37f}
.state-dot.warn{background:#d99a2b}.state-dot.old{background:#d94b55}
.loading{padding:54px;text-align:center;color:#8f8f89;font-size:13px}
.error-box{padding:18px;color:#b33945;background:#fff0f1;border:1px solid #f0cfd2;border-radius:12px;font-size:12px}
@media(max-width:1000px){.kpi-grid{grid-template-columns:1fr 1fr}.main-grid{grid-template-columns:1fr}.freshness-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){.overview{padding:15px}.overview-head{display:block}.month-nav{margin-top:16px!important;width:100%;justify-content:center}.kpi-grid{grid-template-columns:1fr}.freshness-grid{grid-template-columns:1fr 1fr}.platform-panel{overflow-x:auto}.platform-table{min-width:670px}.kpi-value{font-size:24px}}
</style>
<link rel="stylesheet" href="du-theme.css">
</head>
<body>
<main class="overview">
    <header class="overview-head">
        <div>
            <div class="eyebrow">DU-SPACE BUSINESS</div>
            <h1>사업 현황</h1>
            <p class="overview-sub">얼마를 팔았고, 주요 비용을 얼마나 썼는지 한눈에 확인합니다.</p>
        </div>
        <div class="month-nav">
            <button class="nav-btn" type="button" onclick="changeMonth(-1)" aria-label="이전 달">‹</button>
            <div class="month-label" id="monthLabel"></div>
            <button class="nav-btn" type="button" onclick="changeMonth(1)" aria-label="다음 달">›</button>
            <button class="current-btn" type="button" onclick="goCurrentMonth()">이번 달</button>
        </div>
    </header>

    <section id="dashboard"><div class="loading">사업 데이터를 불러오는 중입니다.</div></section>
</main>

<script>
const SUPABASE_URL='https://hayfpcuacwkytbjwjdhm.supabase.co';
const SUPABASE_KEY='sb_publishable_OnGhN5iA72Y6H0jmTu82tg_Vv9VJyI7';
const {createClient}=window.supabase;
const db=createClient(SUPABASE_URL,SUPABASE_KEY);

const PLATFORMS=['네이버','쿠팡','오늘의집','아이디어스'];
// 현재 사이트에서 사용 중인 수수료 설정을 그대로 사용합니다.
const COMMISSION_RATES={'네이버':0.055,'쿠팡':0.11,'오늘의집':0,'아이디어스':0.15};
const PLATFORM_COLORS={'네이버':'#10a37f','쿠팡':'#d94b55','오늘의집':'#2d9bc1','아이디어스':'#df7568'};
const BUSINESS_EXPENSE_CATEGORIES=new Set(['사업지출','고정비','플랫폼결제','세금']);

let currentDate=new Date();
const fmt=value=>Math.round(Number(value)||0).toLocaleString('ko-KR');
const dateKey=value=>String(value||'').slice(0,10);

function monthRange(){
    const year=currentDate.getFullYear();
    const month=currentDate.getMonth();
    const lastDay=new Date(year,month+1,0).getDate();
    const mm=String(month+1).padStart(2,'0');
    return{
        year,
        month:month+1,
        start:`${year}-${mm}-01`,
        end:`${year}-${mm}-${String(lastDay).padStart(2,'0')}`
    };
}

function updateMonthLabel(){
    const{year,month}=monthRange();
    document.getElementById('monthLabel').textContent=`${year}년 ${month}월`;
}

function changeMonth(direction){
    currentDate.setMonth(currentDate.getMonth()+direction);
    updateMonthLabel();
    loadDashboard();
}

function goCurrentMonth(){
    currentDate=new Date();
    updateMonthLabel();
    loadDashboard();
}

async function fetchAll(table,select,filters={}){
    const pageSize=1000;
    let rows=[];
    for(let from=0;;from+=pageSize){
        let query=db.from(table).select(select);
        (filters.gte||[]).forEach(([column,value])=>{query=query.gte(column,value)});
        (filters.lte||[]).forEach(([column,value])=>{query=query.lte(column,value)});
        const{data,error}=await query.range(from,from+pageSize-1);
        if(error)throw error;
        if(!data?.length)break;
        rows=rows.concat(data);
        if(data.length<pageSize)break;
    }
    return rows;
}

async function latestDate(table,column,filterColumn,filterValue){
    let query=db.from(table).select(column).order(column,{ascending:false}).limit(1);
    if(filterColumn)query=query.eq(filterColumn,filterValue);
    const{data,error}=await query;
    if(error)throw error;
    return dateKey(data?.[0]?.[column]);
}

function allocatePeriodAd(entry,start,end){
    const periodStart=new Date(`${entry.start_date}T00:00:00`);
    const periodEnd=new Date(`${entry.end_date}T00:00:00`);
    const monthStart=new Date(`${start}T00:00:00`);
    const monthEnd=new Date(`${end}T00:00:00`);
    const overlapStart=new Date(Math.max(periodStart,monthStart));
    const overlapEnd=new Date(Math.min(periodEnd,monthEnd));
    if(overlapStart>overlapEnd)return 0;
    const totalDays=Math.max(1,Math.round((periodEnd-periodStart)/86400000)+1);
    const overlapDays=Math.round((overlapEnd-overlapStart)/86400000)+1;
    return (Number(entry.total_cost)||0)/totalDays*overlapDays;
}

function freshnessInfo(date){
    if(!date)return{label:'데이터 없음',className:'old'};
    const today=new Date();
    today.setHours(0,0,0,0);
    const target=new Date(`${date}T00:00:00`);
    const days=Math.max(0,Math.round((today-target)/86400000));
    if(days<=1)return{label:'최신',className:''};
    if(days<=7)return{label:`${days}일 전`,className:'warn'};
    return{label:`${days}일 전`,className:'old'};
}

async function loadDashboard(){
    const root=document.getElementById('dashboard');
    root.innerHTML='<div class="loading">사업 데이터를 불러오는 중입니다.</div>';
    const{start,end,month}=monthRange();

    try{
        const[
            orders,
            costs,
            dailyAds,
            periodAds,
            cashTransactions,
            latestPlatforms,
            latestCash,
            latestDailyAd,
            latestPeriodAd
        ]=await Promise.all([
            fetchAll('orders','order_no,order_date,platform,product,option,quantity,price',{gte:[['order_date',start]],lte:[['order_date',end]]}),
            fetchAll('product_costs','platform,product,option,cost'),
            fetchAll('ad_costs','ad_date,platform,cost',{gte:[['ad_date',start]],lte:[['ad_date',end]]}),
            fetchAll('product_ad_costs','platform,start_date,end_date,total_cost',{lte:[['start_date',end]],gte:[['end_date',start]]}),
            fetchAll('cash_transactions','tx_date,category,sub_category,withdraw',{gte:[['tx_date',start]],lte:[['tx_date',end]]}),
            Promise.all(PLATFORMS.map(platform=>latestDate('orders','order_date','platform',platform))),
            latestDate('cash_transactions','tx_date'),
            latestDate('ad_costs','ad_date'),
            latestDate('product_ad_costs','end_date')
        ]);

        const costMap=new Map(costs.map(item=>[
            `${item.platform}|${item.product}|${item.option||''}`,
            Number(item.cost)||0
        ]));

        const platformData={};
        PLATFORMS.forEach(platform=>{
            platformData[platform]={sales:0,cost:0,commission:0,ad:0,estimatedProfit:0,orderCount:0,uniqueOrders:new Set()};
        });

        orders.forEach(order=>{
            const data=platformData[order.platform];
            if(!data)return;
            const quantity=Number(order.quantity)||1;
            const sales=(Number(order.price)||0)*quantity;
            const cost=costMap.get(`${order.platform}|${order.product}|${order.option||''}`)||0;
            data.sales+=sales;
            data.cost+=cost*quantity;
            data.orderCount+=1;
            if(order.order_no)data.uniqueOrders.add(String(order.order_no).replace(/_\d+$/,''));
        });

        dailyAds.forEach(entry=>{
            if(platformData[entry.platform])platformData[entry.platform].ad+=Number(entry.cost)||0;
        });
        periodAds.forEach(entry=>{
            if(platformData[entry.platform])platformData[entry.platform].ad+=allocatePeriodAd(entry,start,end);
        });

        PLATFORMS.forEach(platform=>{
            const data=platformData[platform];
            data.commission=data.sales*(COMMISSION_RATES[platform]||0);
            if(platform==='아이디어스')data.commission+=data.uniqueOrders.size*2500;
            data.estimatedProfit=data.sales-data.cost-data.commission-data.ad;
        });

        const totalSales=PLATFORMS.reduce((sum,p)=>sum+platformData[p].sales,0);
        const totalCost=PLATFORMS.reduce((sum,p)=>sum+platformData[p].cost,0);
        const totalCommission=PLATFORMS.reduce((sum,p)=>sum+platformData[p].commission,0);
        const totalAd=PLATFORMS.reduce((sum,p)=>sum+platformData[p].ad,0);
        const estimatedProfit=totalSales-totalCost-totalCommission-totalAd;
        const roas=totalAd>0?totalSales/totalAd*100:0;

        const businessExpenses=cashTransactions.filter(transaction=>
            (Number(transaction.withdraw)||0)>0
            && BUSINESS_EXPENSE_CATEGORIES.has(transaction.category)
        );
        const actualSpend=businessExpenses.reduce((sum,t)=>sum+(Number(t.withdraw)||0),0);
        const expenseGroups={};
        businessExpenses.forEach(transaction=>{
            const key=transaction.sub_category||transaction.category||'기타';
            expenseGroups[key]=(expenseGroups[key]||0)+(Number(transaction.withdraw)||0);
        });
        const sortedExpenses=Object.entries(expenseGroups).sort((a,b)=>b[1]-a[1]);
        const maxExpense=sortedExpenses[0]?.[1]||1;

        const platformRows=PLATFORMS.map(platform=>{
            const data=platformData[platform];
            const share=totalSales>0?data.sales/totalSales*100:0;
            return`<tr>
                <td><span class="platform-name"><span class="platform-dot" style="--dot:${PLATFORM_COLORS[platform]}"></span>${platform}</span></td>
                <td>${fmt(data.sales)}원</td>
                <td>${share.toFixed(1)}%</td>
                <td>${fmt(data.cost)}원</td>
                <td>${fmt(data.commission)}원</td>
                <td>${fmt(data.ad)}원</td>
                <td class="${data.estimatedProfit>=0?'money-positive':'money-negative'}">${fmt(data.estimatedProfit)}원</td>
            </tr>`;
        }).join('');

        const expenseRows=sortedExpenses.slice(0,8).map(([name,value])=>`
            <div class="expense-row">
                <div class="expense-name" title="${name}">${name}</div>
                <div class="expense-track"><div class="expense-bar" style="width:${Math.max(3,value/maxExpense*100)}%"></div></div>
                <div class="expense-value">${fmt(value)}원</div>
            </div>`).join('');

        const freshnessItems=[
            ...PLATFORMS.map((platform,index)=>({name:platform,date:latestPlatforms[index]})),
            {name:'사업지출',date:latestCash},
            {name:'광고비',date:[latestDailyAd,latestPeriodAd].filter(Boolean).sort().at(-1)||''}
        ].map(item=>{
            const state=freshnessInfo(item.date);
            return`<div class="freshness-item">
                <div class="freshness-name">${item.name}</div>
                <div class="freshness-date">${item.date||'-'}</div>
                <div class="freshness-state"><span class="state-dot ${state.className}"></span>${state.label}</div>
            </div>`;
        }).join('');

        root.innerHTML=`
            <section class="kpi-grid">
                <article class="kpi sales">
                    <div class="kpi-label"><span>${month}월 주문매출</span><span class="delta">${orders.length}개 항목</span></div>
                    <div class="kpi-value">${fmt(totalSales)}원</div>
                    <div class="kpi-sub">고객 결제 기준 · 배송비 제외</div>
                </article>
                <article class="kpi profit">
                    <div class="kpi-label"><span>예상 판매이익</span><span class="delta">${totalSales?((estimatedProfit/totalSales)*100).toFixed(1):'0.0'}%</span></div>
                    <div class="kpi-value">${fmt(estimatedProfit)}원</div>
                    <div class="kpi-sub">원가 · 수수료 · 광고비 차감</div>
                </article>
                <article class="kpi spend">
                    <div class="kpi-label"><span>실제 사업지출</span><span class="delta">은행 업로드</span></div>
                    <div class="kpi-value">${fmt(actualSpend)}원</div>
                    <div class="kpi-sub">개인 · 이체 · 제외 거래 미포함</div>
                </article>
                <article class="kpi ads">
                    <div class="kpi-label"><span>광고비</span><span class="delta">ROAS ${roas?Math.round(roas)+'%':'-'}</span></div>
                    <div class="kpi-value">${fmt(totalAd)}원</div>
                    <div class="kpi-sub">일별 광고와 기간 광고 합계</div>
                </article>
            </section>

            <section class="main-grid">
                <article class="panel">
                    <div class="panel-head">
                        <div><div class="panel-title">예상 판매이익 계산</div><div class="panel-desc">주문 데이터 기준으로 계산한 판매 성과입니다.</div></div>
                        <a class="text-link" href="order-finance.html">자세히</a>
                    </div>
                    <div class="bridge">
                        <div class="bridge-row"><span class="bridge-name">주문매출</span><span class="bridge-value">${fmt(totalSales)}원</span></div>
                        <div class="bridge-row minus"><span class="bridge-name">플랫폼 수수료</span><span class="bridge-value">-${fmt(totalCommission)}원</span></div>
                        <div class="bridge-row minus"><span class="bridge-name">상품 원가</span><span class="bridge-value">-${fmt(totalCost)}원</span></div>
                        <div class="bridge-row minus"><span class="bridge-name">광고비</span><span class="bridge-value">-${fmt(totalAd)}원</span></div>
                        <div class="bridge-row total"><span class="bridge-name">예상 판매이익</span><span class="bridge-value">${fmt(estimatedProfit)}원</span></div>
                    </div>
                </article>
                <article class="panel">
                    <div class="panel-head">
                        <div><div class="panel-title">실제 사업지출</div><div class="panel-desc">은행 거래 중 사업지출·고정비만 집계합니다.</div></div>
                        <a class="text-link" href="cashflow-dashboard.html">자세히</a>
                    </div>
                    <div class="expense-list">${expenseRows||'<div class="expense-empty">이 달의 사업지출 데이터가 없습니다.</div>'}</div>
                </article>
            </section>

            <section class="panel platform-panel">
                <div class="panel-head">
                    <div><div class="panel-title">플랫폼별 판매 성과</div><div class="panel-desc">현재 설정된 수수료율과 상품 원가를 기준으로 계산합니다.</div></div>
                    <a class="text-link" href="order-daily.html">일별 보기</a>
                </div>
                <table class="platform-table">
                    <thead><tr><th>플랫폼</th><th>매출</th><th>비중</th><th>원가</th><th>수수료</th><th>광고비</th><th>예상 이익</th></tr></thead>
                    <tbody>${platformRows}</tbody>
                </table>
            </section>

            <section class="panel status-panel">
                <div class="panel-head">
                    <div><div class="panel-title">데이터 최신 상태</div><div class="panel-desc">잔액 대신 각 데이터가 언제까지 반영됐는지 보여줍니다.</div></div>
                </div>
                <div class="freshness-grid">${freshnessItems}</div>
            </section>`;
    }catch(error){
        console.error(error);
        root.innerHTML='<div class="error-box">데이터를 불러오지 못했습니다. 잠시 후 다시 새로고침해주세요.</div>';
    }
}

updateMonthLabel();
loadDashboard();
</script>
</body>
</html>
