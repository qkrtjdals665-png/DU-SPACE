<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>입출금 관리 - 전체 지출 현황</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:#ede8df;min-height:100vh;color:#252523}
.header{background:#1a1a2e;color:#fff;padding:20px 32px}.header h1{font-size:20px;font-weight:750}.header h1 span{color:#f4a900}
.container{max-width:1280px;margin:0 auto;padding:24px}
.month-nav{display:flex;align-items:center;gap:8px;background:#fff;padding:14px 18px;border-radius:14px;border:1px solid #d9d4ca;margin-bottom:12px;flex-wrap:wrap}
.month-nav button,.view-btn,.link-btn{padding:8px 14px;border:0;border-radius:8px;font-family:inherit;font-size:12px;font-weight:650;cursor:pointer}
.month-nav .nav-btn{background:#f5f0e8;color:#555}.month-nav .current-btn{background:#f4a900;color:#1a1a2e}.month-label{font-size:18px;font-weight:750;min-width:140px;text-align:center}
.view-tabs{display:flex;gap:6px;padding:5px;margin-bottom:18px;width:max-content;max-width:100%;overflow:auto;border:1px solid #d9d4ca;border-radius:12px;background:#e5dfd5}
.view-btn{background:transparent;color:#6e6b65;white-space:nowrap}.view-btn.active{background:#fff;color:#20201e;box-shadow:0 1px 4px rgba(20,20,18,.1)}
.summary-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.stat-card,.card{background:#fff;border-radius:14px;border:1px solid #d9d4ca;box-shadow:0 1px 2px rgba(24,24,22,.03)}
.stat-card{padding:17px;text-align:center}.stat-label{font-size:11px;color:#777;font-weight:650;margin-bottom:6px}.stat-value{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}.stat-sub{font-size:9px;color:#aaa;margin-top:4px}
.amount-in{color:#0f9b58;font-weight:700}.amount-business{color:#e94560}.amount-personal{color:#2f6feb}.amount-all{color:#805ad5}.amount-out{color:#e94560;font-weight:700}
.notice{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;margin-bottom:18px;border-radius:11px;background:#fff7e7;border:1px solid #ead6a9;color:#82591b;font-size:11px;line-height:1.5}.notice.hidden{display:none}.link-btn{background:#20201e;color:#fff;white-space:nowrap}
.card{padding:22px;margin-bottom:18px}.card-title{font-size:15px;font-weight:750;color:#1a1a2e;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.card-note{font-size:10px;color:#999;font-weight:500}
.two-col{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.chart-container{position:relative;height:280px;margin:8px 0}
.table-wrap{overflow:auto}.cat-table,.tx-table{width:100%;border-collapse:collapse;font-size:12px;min-width:720px}.cat-table th,.tx-table th{background:#f5f0e8;padding:10px 8px;text-align:center;font-weight:650;color:#666;border-bottom:2px solid #d9d4ca;font-size:10px}.cat-table td,.tx-table td{padding:10px 8px;border-bottom:1px solid #f0ebe3;text-align:center}.cat-table tr:hover td,.tx-table tr:hover td{background:#faf8f4}.tx-table td:nth-child(2),.tx-table td:nth-child(3){text-align:left}.tx-table td:last-child{text-align:right;font-weight:750;color:#e94560;font-variant-numeric:tabular-nums}
.bar-bg{height:6px;background:#f0ebe3;border-radius:3px;overflow:hidden;min-width:80px}.bar-fill{height:100%;border-radius:3px}.cat-pill{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:700;background:var(--bg);color:var(--color)}
.merchant{font-weight:650;color:#353531}.memo{font-size:9px;color:#999;margin-top:3px;max-width:360px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.no-data{text-align:center;padding:42px;color:#aaa;font-size:13px}
@media(max-width:1000px){.summary-grid{grid-template-columns:repeat(3,1fr)}.two-col{grid-template-columns:1fr}}
@media(max-width:650px){.container{padding:14px}.summary-grid{grid-template-columns:1fr 1fr}.stat-card{padding:14px 10px}.stat-value{font-size:18px}.month-label{order:-1;width:100%;text-align:left}.view-tabs{width:100%}.view-btn{flex:1}.notice{align-items:flex-start;flex-direction:column}.card{padding:15px}}
</style>
<link rel="stylesheet" href="du-theme.css">
</head>
<body>
<div class="header"><h1>💳 사업비와 생활비 <span>전체 지출</span></h1></div>
<main class="container">
    <div class="month-nav">
        <button class="nav-btn" onclick="changeMonth(-1)">◀ 이전달</button>
        <div class="month-label" id="monthLabel"></div>
        <button class="nav-btn" onclick="changeMonth(1)">다음달 ▶</button>
        <button class="current-btn" onclick="goCurrentMonth()">이번달</button>
    </div>
    <nav class="view-tabs" aria-label="지출 범위 선택">
        <button class="view-btn active" data-mode="combined" onclick="changeMode('combined')">전체 소비지출</button>
        <button class="view-btn" data-mode="business" onclick="changeMode('business')">사업지출</button>
        <button class="view-btn" data-mode="personal" onclick="changeMode('personal')">생활비</button>
        <button class="view-btn" data-mode="all" onclick="changeMode('all')">모든 출금</button>
    </nav>
    <section class="summary-grid" id="summaryGrid"></section>
    <div class="notice hidden" id="unclassifiedNotice"></div>
    <section id="reportArea"><div class="card no-data">불러오는 중...</div></section>
</main>
<script>
const SUPABASE_URL='https://hayfpcuacwkytbjwjdhm.supabase.co';
const SUPABASE_KEY='sb_publishable_OnGhN5iA72Y6H0jmTu82tg_Vv9VJyI7';
const{createClient}=window.supabase;
const db=createClient(SUPABASE_URL,SUPABASE_KEY);
const BUSINESS_CATEGORIES=new Set(['사업지출','고정비','플랫폼결제','세금']);
const PERSONAL_CATEGORY='개인';
const CAT_COLORS={'매출':'#0f9b58','사업지출':'#e94560','고정비':'#ff9800','플랫폼결제':'#f4a900','세금':'#805ad5','개인':'#2f6feb','미분류':'#8a8a84','통장간이체':'#5f6b7a','제외':'#aaa'};
const MODE_LABELS={combined:'전체 소비지출',business:'사업지출',personal:'생활비',all:'모든 출금'};
let currentDate=new Date();
let currentMode='combined';
let chartInstances=[];
const fmt=n=>Math.round(Number(n)||0).toLocaleString('ko-KR');
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));

function updateMonthLabel(){document.getElementById('monthLabel').textContent=`${currentDate.getFullYear()}년 ${currentDate.getMonth()+1}월`}
function changeMonth(dir){currentDate.setMonth(currentDate.getMonth()+dir);updateMonthLabel();loadDashboard()}
function goCurrentMonth(){currentDate=new Date();updateMonthLabel();loadDashboard()}
function changeMode(mode){currentMode=mode;document.querySelectorAll('.view-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.mode===mode));loadDashboard()}
function openTransactionList(){if(window.self!==window.top&&typeof window.parent.navigate==='function')window.parent.navigate('cf-list');else location.href='cashflow-list.html'}

async function fetchAll(table,select,filters={}){
    const PAGE=1000;let all=[],from=0;
    while(true){
        let query=db.from(table).select(select);
        if(filters.gte)filters.gte.forEach(([column,value])=>query=query.gte(column,value));
        if(filters.lte)filters.lte.forEach(([column,value])=>query=query.lte(column,value));
        const{data,error}=await query.range(from,from+PAGE-1);
        if(error)throw error;
        if(!data?.length)break;
        all=all.concat(data);
        if(data.length<PAGE)break;
        from+=PAGE;
    }
    return all;
}

function isBusiness(tx){return BUSINESS_CATEGORIES.has(tx.category)}
function isPersonal(tx){return tx.category===PERSONAL_CATEGORY}
function visibleExpenses(withdrawals){
    if(currentMode==='business')return withdrawals.filter(isBusiness);
    if(currentMode==='personal')return withdrawals.filter(isPersonal);
    if(currentMode==='all')return withdrawals;
    return withdrawals.filter(tx=>isBusiness(tx)||isPersonal(tx));
}
function categoryStyle(category){const color=CAT_COLORS[category]||'#777';return`--color:${color};--bg:${color}18`}
function destroyCharts(){chartInstances.forEach(chart=>chart.destroy());chartInstances=[]}

async function loadDashboard(){
    destroyCharts();
    const y=currentDate.getFullYear(),m=currentDate.getMonth();
    const start=`${y}-${String(m+1).padStart(2,'0')}-01`;
    const lastDay=new Date(y,m+1,0).getDate();
    const end=`${y}-${String(m+1).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
    try{
        const[txs,accounts]=await Promise.all([
            fetchAll('cash_transactions','*',{gte:[['tx_date',start]],lte:[['tx_date',end]]}),
            fetchAll('bank_accounts','id,name')
        ]);
        const accountMap=new Map(accounts.map(account=>[account.id,account.name]));
        if(!txs.length){
            document.getElementById('summaryGrid').innerHTML='';
            document.getElementById('unclassifiedNotice').classList.add('hidden');
            document.getElementById('reportArea').innerHTML='<div class="card no-data">이 달의 입출금 데이터가 없습니다.<br>은행 엑셀을 먼저 업로드해주세요.</div>';
            return;
        }
        const incomeTxs=txs.filter(tx=>(tx.deposit||0)>0&&tx.category==='매출');
        const withdrawals=txs.filter(tx=>(tx.withdraw||0)>0);
        const businessTxs=withdrawals.filter(isBusiness);
        const personalTxs=withdrawals.filter(isPersonal);
        const shownTxs=visibleExpenses(withdrawals);
        const totalIn=incomeTxs.reduce((sum,tx)=>sum+Number(tx.deposit||0),0);
        const businessOut=businessTxs.reduce((sum,tx)=>sum+Number(tx.withdraw||0),0);
        const personalOut=personalTxs.reduce((sum,tx)=>sum+Number(tx.withdraw||0),0);
        const combinedOut=businessOut+personalOut;
        const allOut=withdrawals.reduce((sum,tx)=>sum+Number(tx.withdraw||0),0);
        const unclassified=withdrawals.filter(tx=>!tx.category||tx.category==='미분류');
        const latestDate=txs.map(tx=>tx.tx_date).filter(Boolean).sort().at(-1)||'-';

        document.getElementById('summaryGrid').innerHTML=`
            <article class="stat-card"><div class="stat-label">플랫폼 정산 입금</div><div class="stat-value amount-in">+${fmt(totalIn)}원</div><div class="stat-sub">매출 분류 입금</div></article>
            <article class="stat-card"><div class="stat-label">사업지출</div><div class="stat-value amount-business">-${fmt(businessOut)}원</div><div class="stat-sub">사업비·고정비·세금</div></article>
            <article class="stat-card"><div class="stat-label">생활비</div><div class="stat-value amount-personal">-${fmt(personalOut)}원</div><div class="stat-sub">식비·교통비·쇼핑 등</div></article>
            <article class="stat-card"><div class="stat-label">전체 소비지출</div><div class="stat-value amount-all">-${fmt(combinedOut)}원</div><div class="stat-sub">사업지출 + 생활비</div></article>
            <article class="stat-card"><div class="stat-label">모든 출금</div><div class="stat-value">-${fmt(allOut)}원</div><div class="stat-sub">이체·제외·미분류 포함 · ${latestDate}</div></article>`;

        const notice=document.getElementById('unclassifiedNotice');
        if(unclassified.length){
            const amount=unclassified.reduce((sum,tx)=>sum+Number(tx.withdraw||0),0);
            notice.innerHTML=`<span><b>미분류 출금 ${unclassified.length}건 · ${fmt(amount)}원</b><br>정확한 사업비·생활비 합계를 위해 거래 목록에서 분류해주세요.</span><button class="link-btn" onclick="openTransactionList()">거래 분류하기</button>`;
            notice.classList.remove('hidden');
        }else notice.classList.add('hidden');
        renderReport(shownTxs,incomeTxs,accountMap);
    }catch(error){
        console.error(error);
        document.getElementById('summaryGrid').innerHTML='';
        document.getElementById('reportArea').innerHTML='<div class="card no-data">지출 데이터를 불러오지 못했습니다. 잠시 후 다시 열어주세요.</div>';
    }
}

function renderReport(expenseTxs,incomeTxs,accountMap){
    const totalShown=expenseTxs.reduce((sum,tx)=>sum+Number(tx.withdraw||0),0);
    const catData={};
    expenseTxs.forEach(tx=>{
        const cat=tx.category||'미분류',sub=tx.sub_category||'기타';
        if(!catData[cat])catData[cat]={out:0,count:0,subs:{}};
        catData[cat].out+=Number(tx.withdraw||0);catData[cat].count++;
        if(!catData[cat].subs[sub])catData[cat].subs[sub]={out:0,count:0};
        catData[cat].subs[sub].out+=Number(tx.withdraw||0);catData[cat].subs[sub].count++;
    });
    const maxAmount=Math.max(...Object.values(catData).map(data=>data.out),1);
    const orderedCats=Object.entries(catData).sort((a,b)=>b[1].out-a[1].out);
    let html=`<section class="card"><div class="card-title"><span>📊 ${MODE_LABELS[currentMode]} 카테고리</span><span class="card-note">${expenseTxs.length}건 · ${fmt(totalShown)}원</span></div>`;
    if(!expenseTxs.length)html+='<div class="no-data">선택한 범위에 지출 내역이 없습니다.</div>';
    else{
        html+='<div class="table-wrap"><table class="cat-table"><thead><tr><th>분류</th><th>건수</th><th>출금</th><th>비중</th></tr></thead><tbody>';
        orderedCats.forEach(([cat,data])=>{
            const color=CAT_COLORS[cat]||'#777',pct=totalShown>0?(data.out/totalShown*100).toFixed(1):0;
            html+=`<tr><td style="text-align:left"><span class="cat-pill" style="${categoryStyle(cat)}">${escapeHtml(cat)}</span></td><td>${data.count}</td><td class="amount-out">-${fmt(data.out)}원</td><td><div class="bar-bg"><div class="bar-fill" style="width:${data.out/maxAmount*100}%;background:${color}"></div></div><span style="font-size:9px;color:#888">${pct}%</span></td></tr>`;
            Object.entries(data.subs).sort((a,b)=>b[1].out-a[1].out).forEach(([sub,subData])=>{html+=`<tr style="font-size:10px;color:#888"><td style="text-align:left;padding-left:25px">└ ${escapeHtml(sub)}</td><td>${subData.count}</td><td>-${fmt(subData.out)}원</td><td></td></tr>`});
        });
        html+='</tbody></table></div>';
    }
    html+='</section>';
    html+='<section class="two-col"><article class="card"><div class="card-title"><span>📈 일별 지출 흐름</span></div><div class="chart-container"><canvas id="dailyChart"></canvas></div></article><article class="card"><div class="card-title"><span>🥧 지출 비중</span></div><div class="chart-container"><canvas id="pieChart"></canvas></div></article></section>';
    html+=`<section class="card"><div class="card-title"><span>🧾 ${MODE_LABELS[currentMode]} 상세 내역</span><button class="link-btn" onclick="openTransactionList()">전체 거래 목록</button></div>`;
    if(!expenseTxs.length)html+='<div class="no-data">표시할 거래가 없습니다.</div>';
    else{
        const sorted=[...expenseTxs].sort((a,b)=>`${b.tx_date} ${b.tx_time||''}`.localeCompare(`${a.tx_date} ${a.tx_time||''}`)).slice(0,100);
        html+='<div class="table-wrap"><table class="tx-table"><thead><tr><th>날짜</th><th>사용처·적요</th><th>통장</th><th>분류</th><th>출금액</th></tr></thead><tbody>';
        sorted.forEach(tx=>{
            const merchant=tx.counterparty||tx.memo||tx.raw_description||'거래처 정보 없음';
            const detail=[tx.memo,tx.raw_description].filter(value=>value&&value!==merchant).join(' · ');
            html+=`<tr><td>${escapeHtml(tx.tx_date)}</td><td><div class="merchant">${escapeHtml(merchant)}</div>${detail?`<div class="memo" title="${escapeHtml(detail)}">${escapeHtml(detail)}</div>`:''}</td><td>${escapeHtml(accountMap.get(tx.account_id)||'-')}</td><td><span class="cat-pill" style="${categoryStyle(tx.category||'미분류')}">${escapeHtml(tx.category||'미분류')} · ${escapeHtml(tx.sub_category||'기타')}</span></td><td>-${fmt(tx.withdraw)}원</td></tr>`;
        });
        html+='</tbody></table></div>';
    }
    html+='</section>';
    document.getElementById('reportArea').innerHTML=html;
    if(!expenseTxs.length)return;

    const dailyData={};
    expenseTxs.forEach(tx=>{if(!dailyData[tx.tx_date])dailyData[tx.tx_date]={out:0,in:0};dailyData[tx.tx_date].out+=Number(tx.withdraw||0)});
    incomeTxs.forEach(tx=>{if(!dailyData[tx.tx_date])dailyData[tx.tx_date]={out:0,in:0};dailyData[tx.tx_date].in+=Number(tx.deposit||0)});
    const days=Object.keys(dailyData).sort();
    chartInstances.push(new Chart(document.getElementById('dailyChart'),{type:'bar',data:{labels:days.map(day=>day.substring(5)),datasets:[{label:'정산 입금',data:days.map(day=>dailyData[day].in),backgroundColor:'rgba(15,155,88,.55)',borderRadius:4},{label:MODE_LABELS[currentMode],data:days.map(day=>-dailyData[day].out),backgroundColor:'rgba(128,90,213,.62)',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:10,family:'Noto Sans KR'},boxWidth:11}}},scales:{y:{ticks:{callback:value=>(value>=0?'+':'')+fmt(value),font:{size:9}},grid:{color:'#f0ebe3'}},x:{ticks:{font:{size:9},maxRotation:0},grid:{display:false}}}}}));
    chartInstances.push(new Chart(document.getElementById('pieChart'),{type:'doughnut',data:{labels:orderedCats.map(([cat])=>cat),datasets:[{data:orderedCats.map(([,data])=>data.out),backgroundColor:orderedCats.map(([cat])=>CAT_COLORS[cat]||'#777'),borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10,family:'Noto Sans KR'},padding:10,boxWidth:11}}}}}));
}

if(window.self!==window.top)document.querySelectorAll('.header').forEach(element=>element.style.display='none');
document.addEventListener('DOMContentLoaded',()=>{updateMonthLabel();loadDashboard()});
</script>
</body>
</html>
