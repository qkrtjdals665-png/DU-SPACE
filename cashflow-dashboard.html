<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>입출금 관리 - 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:#EDE8DF;min-height:100vh;}
.header{background:#1a1a2e;color:white;padding:20px 32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.header h1{font-size:20px;font-weight:700;}.header h1 span{color:#f4a900;}
.container{max-width:1200px;margin:0 auto;padding:24px;}
.card{background:#fff;border-radius:14px;padding:24px;border:1px solid #D9D4CA;margin-bottom:20px;}
.card-title{font-size:16px;font-weight:700;color:#1a1a2e;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.month-nav{display:flex;align-items:center;gap:8px;background:#fff;padding:14px 20px;border-radius:14px;border:1px solid #D9D4CA;margin-bottom:20px;}
.month-nav button{padding:8px 18px;border:none;border-radius:8px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
.month-nav .nav-btn{background:#f5f0e8;color:#555;}.month-nav .current-btn{background:#f4a900;color:#1a1a2e;}
.month-label{font-size:18px;font-weight:700;min-width:140px;text-align:center;}

.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.stat-card{background:#fff;border-radius:14px;padding:18px;border:1px solid #D9D4CA;text-align:center;}
.stat-label{font-size:11px;color:#888;font-weight:600;margin-bottom:6px;}
.stat-value{font-size:22px;font-weight:800;}
.stat-sub{font-size:10px;color:#aaa;margin-top:4px;}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.chart-container{position:relative;height:280px;margin:12px 0;}

/* 카테고리 테이블 */
.cat-table{width:100%;border-collapse:collapse;font-size:13px;}
.cat-table th{background:#f5f0e8;padding:10px 8px;text-align:center;font-weight:600;color:#555;border-bottom:2px solid #D9D4CA;font-size:11px;}
.cat-table td{padding:10px 8px;border-bottom:1px solid #f0ebe3;text-align:center;}
.cat-table tr:hover td{background:#faf8f4;}
.bar-bg{height:6px;background:#f0ebe3;border-radius:3px;overflow:hidden;min-width:80px;}
.bar-fill{height:100%;border-radius:3px;}

.amount-in{color:#0f9b58;font-weight:700;}
.amount-out{color:#e94560;font-weight:700;}
.no-data{text-align:center;padding:40px;color:#bbb;font-size:14px;}
@media(max-width:768px){.summary-grid{grid-template-columns:1fr 1fr;}.two-col{grid-template-columns:1fr;}}
</style>
<link rel="stylesheet" href="du-theme.css">
</head>
<body>
<div class="header"><h1>💰 실제 사업지출 <span>현황</span></h1></div>
<div class="container">
    <div class="month-nav">
        <button class="nav-btn" onclick="changeMonth(-1)">◀ 이전달</button>
        <div class="month-label" id="monthLabel"></div>
        <button class="nav-btn" onclick="changeMonth(1)">다음달 ▶</button>
        <button class="current-btn" onclick="goCurrentMonth()">이번달</button>
    </div>
    <div class="summary-grid" id="summaryGrid"></div>
    <div id="reportArea"><div class="card no-data">로딩 중...</div></div>
</div>
<script>
const SUPABASE_URL='https://hayfpcuacwkytbjwjdhm.supabase.co';
const SUPABASE_KEY='sb_publishable_OnGhN5iA72Y6H0jmTu82tg_Vv9VJyI7';
const{createClient}=window.supabase;
const db=createClient(SUPABASE_URL,SUPABASE_KEY);

const CAT_COLORS={'매출':'#0f9b58','사업지출':'#e94560','고정비':'#ff9800','플랫폼결제':'#f4a900','세금':'#805ad5'};
const BUSINESS_EXPENSE_CATEGORIES=new Set(['사업지출','고정비','플랫폼결제','세금']);

let currentDate=new Date();

function updateMonthLabel(){document.getElementById('monthLabel').textContent=`${currentDate.getFullYear()}년 ${currentDate.getMonth()+1}월`;}
function changeMonth(dir){currentDate.setMonth(currentDate.getMonth()+dir);updateMonthLabel();loadDashboard();}
function goCurrentMonth(){currentDate=new Date();updateMonthLabel();loadDashboard();}
function fmt(n){return Math.round(n).toLocaleString('ko-KR');}

async function fetchAll(table,select,filters={}){
    const PAGE=1000;let all=[],from=0;
    while(true){
        let q=db.from(table).select(select);
        if(filters.gte)filters.gte.forEach(f=>q=q.gte(f[0],f[1]));
        if(filters.lte)filters.lte.forEach(f=>q=q.lte(f[0],f[1]));
        const{data}=await q.range(from,from+PAGE-1);
        if(!data||!data.length)break;
        all=all.concat(data);
        if(data.length<PAGE)break;
        from+=PAGE;
    }
    return all;
}

async function loadDashboard(){
    const y=currentDate.getFullYear(),m=currentDate.getMonth();
    const start=`${y}-${String(m+1).padStart(2,'0')}-01`;
    const lastDay=new Date(y,m+1,0).getDate();
    const end=`${y}-${String(m+1).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;

    const txs=await fetchAll('cash_transactions','*',{gte:[['tx_date',start]],lte:[['tx_date',end]]});

    if(!txs.length){
        document.getElementById('summaryGrid').innerHTML='';
        document.getElementById('reportArea').innerHTML='<div class="card no-data">이 달의 입출금 데이터가 없습니다.<br>은행 엑셀을 업로드해주세요.</div>';
        return;
    }

    // ── 요약 ──
    const incomeTxs=txs.filter(t=>(t.deposit||0)>0&&t.category==='매출');
    const expenseTxs=txs.filter(t=>(t.withdraw||0)>0&&BUSINESS_EXPENSE_CATEGORIES.has(t.category));
    const totalIn=incomeTxs.reduce((s,t)=>s+(t.deposit||0),0);
    const totalOut=expenseTxs.reduce((s,t)=>s+(t.withdraw||0),0);
    const netFlow=totalIn-totalOut;
    const latestDate=txs.map(t=>t.tx_date).filter(Boolean).sort().at(-1)||'-';

    document.getElementById('summaryGrid').innerHTML=`
        <div class="stat-card"><div class="stat-label">플랫폼 정산 입금</div><div class="stat-value amount-in">+${fmt(totalIn)}</div><div class="stat-sub">매출 분류 입금만</div></div>
        <div class="stat-card"><div class="stat-label">실제 사업지출</div><div class="stat-value amount-out">-${fmt(totalOut)}</div><div class="stat-sub">개인·이체·제외 미포함</div></div>
        <div class="stat-card"><div class="stat-label">정산 입금 - 사업지출</div><div class="stat-value" style="color:${netFlow>=0?'#0f9b58':'#e94560'}">${netFlow>=0?'+':''}${fmt(netFlow)}</div><div class="stat-sub">은행 업로드 기준</div></div>
        <div class="stat-card"><div class="stat-label">데이터 기준일</div><div class="stat-value" style="font-size:18px;color:#555">${latestDate}</div><div class="stat-sub">${txs.length}건 반영</div></div>`;

    // ── 카테고리별 집계 ──
    const catData={};
    [...incomeTxs,...expenseTxs].forEach(t=>{
        const cat=t.category||'미분류';
        if(!catData[cat])catData[cat]={in:0,out:0,count:0,subs:{}};
        if((t.deposit||0)>0)catData[cat].in+=t.deposit||0;
        else catData[cat].out+=t.withdraw||0;
        catData[cat].count++;
        const sub=t.sub_category||'기타';
        if(!catData[cat].subs[sub])catData[cat].subs[sub]={in:0,out:0,count:0};
        if((t.deposit||0)>0)catData[cat].subs[sub].in+=t.deposit||0;
        else catData[cat].subs[sub].out+=t.withdraw||0;
        catData[cat].subs[sub].count++;
    });

    const maxAmount=Math.max(...Object.values(catData).map(d=>Math.max(d.in,d.out)),1);

    let html='<div class="card"><div class="card-title">📊 카테고리별 집계</div>';
    html+='<table class="cat-table"><thead><tr><th>카테고리</th><th>건수</th><th>입금</th><th>출금</th><th>비중</th></tr></thead><tbody>';
    Object.entries(catData).sort((a,b)=>(b[1].in+b[1].out)-(a[1].in+a[1].out)).forEach(([cat,d])=>{
        const color=CAT_COLORS[cat]||'#888';
        const pct=totalOut>0?(d.out/totalOut*100).toFixed(1):0;
        html+=`<tr>
            <td style="font-weight:700;color:${color};text-align:left;">${cat}</td>
            <td>${d.count}</td>
            <td class="amount-in">${d.in?'+'+fmt(d.in):'-'}</td>
            <td class="amount-out">${d.out?'-'+fmt(d.out):'-'}</td>
            <td><div class="bar-bg"><div class="bar-fill" style="width:${d.out/maxAmount*100}%;background:${color};"></div></div><span style="font-size:10px;color:#888;">${d.out>0?pct+'%':''}</span></td>
        </tr>`;
        // 서브카테고리
        Object.entries(d.subs).sort((a,b)=>(b[1].in+b[1].out)-(a[1].in+a[1].out)).forEach(([sub,sd])=>{
            html+=`<tr style="font-size:11px;color:#888;">
                <td style="text-align:left;padding-left:24px;">└ ${sub}</td>
                <td>${sd.count}</td>
                <td>${sd.in?'+'+fmt(sd.in):'-'}</td>
                <td>${sd.out?'-'+fmt(sd.out):'-'}</td>
                <td></td>
            </tr>`;
        });
    });
    html+='</tbody></table></div>';

    // ── 차트 ──
    html+='<div class="two-col">';
    html+='<div class="card"><div class="card-title">📈 일별 현금흐름</div><div class="chart-container"><canvas id="dailyChart"></canvas></div></div>';
    html+='<div class="card"><div class="card-title">🥧 지출 카테고리 비중</div><div class="chart-container"><canvas id="pieChart"></canvas></div></div>';
    html+='</div>';

    document.getElementById('reportArea').innerHTML=html;

    // 일별 차트
    const dailyData={};
    [...incomeTxs,...expenseTxs].forEach(t=>{
        if(!dailyData[t.tx_date])dailyData[t.tx_date]={in:0,out:0};
        if((t.deposit||0)>0&&t.category==='매출')dailyData[t.tx_date].in+=t.deposit||0;
        if((t.withdraw||0)>0&&BUSINESS_EXPENSE_CATEGORIES.has(t.category))dailyData[t.tx_date].out+=t.withdraw||0;
    });
    const days=Object.keys(dailyData).sort();

    new Chart(document.getElementById('dailyChart'),{
        type:'bar',
        data:{labels:days.map(d=>d.substring(5)),
            datasets:[
                {label:'입금',data:days.map(d=>dailyData[d].in),backgroundColor:'rgba(15,155,88,0.6)',borderRadius:4},
                {label:'출금',data:days.map(d=>-dailyData[d].out),backgroundColor:'rgba(233,69,96,0.6)',borderRadius:4}
            ]},
        options:{responsive:true,maintainAspectRatio:false,
            plugins:{legend:{position:'top',labels:{font:{size:11,family:'Noto Sans KR'},boxWidth:12}}},
            scales:{y:{ticks:{callback:v=>(v>=0?'+':'')+fmt(v),font:{size:10}},grid:{color:'#f0ebe3'}},
                x:{ticks:{font:{size:9},maxRotation:0},grid:{display:false}}}}
    });

    // 파이 차트 (지출만)
    const expCats=Object.entries(catData).filter(([,d])=>d.out>0);
    new Chart(document.getElementById('pieChart'),{
        type:'doughnut',
        data:{labels:expCats.map(([c])=>c),
            datasets:[{data:expCats.map(([,d])=>d.out),
                backgroundColor:expCats.map(([c])=>CAT_COLORS[c]||'#888'),borderWidth:2,borderColor:'#fff'}]},
        options:{responsive:true,maintainAspectRatio:false,
            plugins:{legend:{position:'bottom',labels:{font:{size:11,family:'Noto Sans KR'},padding:12,boxWidth:12}}}}
    });
}

if(window.self!==window.top){document.querySelectorAll('.header').forEach(el=>el.style.display='none');}
document.addEventListener('DOMContentLoaded',()=>{updateMonthLabel();loadDashboard();});
</script>
</body>
</html>
