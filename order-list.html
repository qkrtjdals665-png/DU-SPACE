<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주문관리 - 주문 목록</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:#EDE8DF;min-height:100vh;}
.header{background:#1a1a2e;color:white;padding:20px 32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.header h1{font-size:20px;font-weight:700;}.header h1 span{color:#f4a900;}
.nav-links{display:flex;gap:8px;}
.nav-links a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:13px;padding:8px 16px;border-radius:8px;background:rgba(255,255,255,0.1);}
.container{max-width:1400px;margin:0 auto;padding:24px;}
.filter-bar{background:#fff;border-radius:14px;padding:16px 24px;border:1px solid #D9D4CA;margin-bottom:16px;display:flex;gap:14px;align-items:end;flex-wrap:wrap;}
.filter-bar label{font-size:11px;font-weight:600;color:#666;display:block;margin-bottom:3px;}
.filter-bar select,.filter-bar input{padding:8px 12px;border:1.5px solid #D9D4CA;border-radius:8px;font-family:'Noto Sans KR',sans-serif;font-size:13px;}
.filter-bar select:focus,.filter-bar input:focus{outline:none;border-color:#f4a900;}
.btn{padding:8px 16px;border:none;border-radius:8px;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s;white-space:nowrap;}
.btn:hover{transform:translateY(-1px);}
.btn-primary{background:#1a1a2e;color:white;}
.btn-danger{background:#e94560;color:white;}
.btn-warn{background:#f4a900;color:#1a1a2e;}
.btn-sm{padding:6px 12px;font-size:11px;}
/* 삭제 도구 */
.delete-bar{background:#fff;border-radius:14px;padding:16px 24px;border:1px solid #D9D4CA;margin-bottom:16px;}
.delete-bar h4{font-size:13px;font-weight:700;color:#e94560;margin-bottom:12px;}
.delete-options{display:flex;gap:10px;flex-wrap:wrap;align-items:end;}
.delete-options .dopt{display:flex;flex-direction:column;gap:3px;}
.delete-options .dopt label{font-size:11px;font-weight:600;color:#666;}
.delete-options .dopt select{padding:6px 10px;border:1.5px solid #D9D4CA;border-radius:6px;font-family:'Noto Sans KR',sans-serif;font-size:12px;}
.summary-bar{display:flex;gap:20px;font-size:13px;color:#666;margin-left:auto;flex-wrap:wrap;}
.summary-bar strong{color:#1a1a2e;}
.table-section{background:#fff;border-radius:14px;padding:20px;border:1px solid #D9D4CA;overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:1000px;}
thead th{background:#f5f0e8;padding:10px 8px;text-align:left;font-weight:600;color:#555;border-bottom:2px solid #D9D4CA;white-space:nowrap;user-select:none;}
tbody td{padding:9px 8px;border-bottom:1px solid #f0ebe3;}
tbody tr:hover td{background:#faf8f4;}
.platform-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;color:white;}
.text-right{text-align:right;}.text-center{text-align:center;}
.amount{font-variant-numeric:tabular-nums;font-weight:600;}
input[type="checkbox"]{width:16px;height:16px;accent-color:#f4a900;cursor:pointer;}
.date-group{background:#f5f0e8;padding:10px 14px;font-weight:700;font-size:13px;color:#555;border-bottom:2px solid #D9D4CA;}
.pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:20px;}
.pagination button{padding:8px 14px;border:1px solid #D9D4CA;border-radius:8px;background:#fff;font-family:'Noto Sans KR',sans-serif;font-size:13px;cursor:pointer;}
.pagination button.active{background:#1a1a2e;color:white;border-color:#1a1a2e;}
.pagination button:disabled{opacity:0.4;cursor:not-allowed;}
.page-info{font-size:13px;color:#888;}
.toast{position:fixed;bottom:24px;right:24px;padding:14px 24px;border-radius:10px;font-size:13px;font-weight:600;color:white;opacity:0;transform:translateY(20px);transition:all 0.3s;z-index:1000;}
.toast.show{opacity:1;transform:translateY(0);}.toast.success{background:#0f9b58;}.toast.error{background:#e94560;}.toast.info{background:#4285f4;}
/* 모달 */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;justify-content:center;align-items:center;}
.modal-overlay.show{display:flex;}
.modal{background:#fff;border-radius:16px;padding:32px;max-width:440px;width:90%;text-align:center;}
.modal h3{font-size:18px;margin-bottom:12px;color:#e94560;}
.modal p{font-size:13px;color:#666;line-height:1.7;margin-bottom:20px;}
.modal .modal-count{font-size:28px;font-weight:800;color:#e94560;margin:12px 0;}
.modal-btns{display:flex;gap:12px;justify-content:center;}
.modal-btns button{padding:12px 28px;border:none;border-radius:10px;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:700;cursor:pointer;}
@media(max-width:768px){.filter-bar,.delete-options{flex-direction:column;align-items:stretch;}}
</style>
</head>
<body>
<div class="header">
    <h1>📋 주문 <span>목록</span></h1>
    <div class="nav-links"><a href="order-dashboard.html">📊 대시보드</a><a href="order-upload.html">📦 업로드</a></div>
</div>
<div class="container">
    <!-- 필터 -->
    <div class="filter-bar">
        <div><label>플랫폼</label><select id="filterPlatform" onchange="loadOrders()"><option value="전체">전체</option><option value="네이버">네이버</option><option value="쿠팡">쿠팡</option><option value="오늘의집">오늘의집</option><option value="아이디어스">아이디어스</option></select></div>
        <div><label>시작일</label><input type="date" id="filterFrom"></div>
        <div><label>종료일</label><input type="date" id="filterTo"></div>
        <div><label>검색</label><input type="text" id="filterSearch" placeholder="상품명/수취인" style="width:140px;" onkeydown="if(event.key==='Enter')loadOrders()"></div>
        <button class="btn btn-primary" onclick="loadOrders()">🔍 조회</button>
        <div class="summary-bar" id="summaryBar"></div>
    </div>

    <!-- 삭제 도구 -->
    <div class="delete-bar">
        <span style="font-size:13px;font-weight:700;color:#e94560;">🗑 삭제</span>
        <button class="btn btn-danger btn-sm" onclick="deleteSelected()">선택 삭제</button>
        <button class="btn btn-warn btn-sm" onclick="deleteFiltered()">🔍 조회 결과 전체 삭제 (<span id="filteredCount">0</span>건)</button>
        <button class="btn btn-danger btn-sm" onclick="deleteAll()" style="margin-left:auto;">⚠️ DB 전체 삭제</button>
    </div>

    <!-- 테이블 -->
    <div class="table-section">
        <table>
            <thead><tr>
                <th style="width:30px"><input type="checkbox" id="checkAll" onchange="toggleAll()"></th>
                <th>플랫폼</th><th>주문일</th><th>상품명</th><th>옵션</th>
                <th class="text-center">수량</th><th class="text-right">단가</th><th class="text-right">금액</th>
                <th class="text-right">개당원가</th><th class="text-right">개당순익</th><th class="text-right">순익</th>
                <th>수취인</th><th>송장</th>
            </tr></thead>
            <tbody id="orderBody"><tr><td colspan="13" style="text-align:center;color:#ccc;padding:40px;">로딩 중...</td></tr></tbody>
        </table>
    </div>
    <div class="pagination" id="pagination"></div>
</div>

<!-- 삭제 확인 모달 -->
<div class="modal-overlay" id="deleteModal">
    <div class="modal">
        <h3>⚠️ 삭제 확인</h3>
        <p id="deleteMsg"></p>
        <div class="modal-count" id="deleteCount"></div>
        <p style="font-size:12px;color:#e94560;">이 작업은 되돌릴 수 없습니다!</p>
        <div class="modal-btns">
            <button onclick="closeModal()" style="background:#f0ebe3;color:#666;">취소</button>
            <button id="deleteConfirmBtn" style="background:#e94560;color:white;">삭제</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL='https://hayfpcuacwkytbjwjdhm.supabase.co';
const SUPABASE_KEY='sb_publishable_OnGhN5iA72Y6H0jmTu82tg_Vv9VJyI7';
const {createClient}=window.supabase;
const db=createClient(SUPABASE_URL,SUPABASE_KEY);
const PFC={"네이버":"#00C73C","쿠팡":"#E31837","오늘의집":"#35C5F0","아이디어스":"#FF6F61"};

let currentPage=1,PAGE_SIZE=100,allOrders=[],costMap={},adMap={};
const CR={"네이버":0.055,"쿠팡":0.11,"아이디어스":0.15,"오늘의집":0};

function getCost(o){
    const key=`${o.platform}|${o.product}|${o.option||''}`;
    if(costMap[key]!==undefined)return costMap[key];
    // 옵션 없이도 매칭 시도
    const key2=`${o.platform}|${o.product}|`;
    if(costMap[key2]!==undefined)return costMap[key2];
    return null;
}
function getProfit(o){
    const qty=o.quantity||1;
    const amt=Math.round((o.price||0)*qty);
    const commission=Math.round(amt*(CR[o.platform]||0));
    const cost=getCost(o);
    if(cost===null)return null;
    return amt-commission-Math.round(cost*qty);
}

function initDates(){
    const now=new Date(),y=now.getFullYear(),m=now.getMonth();
    document.getElementById('filterFrom').value=`${y}-${String(m+1).padStart(2,'0')}-01`;
    document.getElementById('filterTo').value=`${y}-${String(m+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
}

async function loadOrders(){
    const pf=document.getElementById('filterPlatform').value;
    const from=document.getElementById('filterFrom').value;
    const to=document.getElementById('filterTo').value;
    const search=document.getElementById('filterSearch').value.trim();

    // 원가 로드
    const{data:costs}=await db.from('product_costs').select('platform,product,option,cost');
    costMap={};
    (costs||[]).forEach(c=>{costMap[`${c.platform}|${c.product}|${c.option||''}`]=c.cost||0;});

    // 광고비 로드
    const{data:ads}=await db.from('ad_costs').select('ad_date,platform,cost');
    adMap={};
    (ads||[]).forEach(a=>{
        if(!adMap[a.ad_date])adMap[a.ad_date]=0;
        adMap[a.ad_date]+=(a.cost||0);
    });

    let q=db.from('orders').select('id,platform,order_date,order_no,product,option,quantity,price,recipient,tracking');
    if(from)q=q.gte('order_date',from);
    if(to)q=q.lte('order_date',to);
    if(pf!=='전체')q=q.eq('platform',pf);
    if(search)q=q.or(`product.ilike.%${search}%,recipient.ilike.%${search}%`);
    q=q.order('order_date',{ascending:false}).order('id',{ascending:false}).limit(2000);

    const{data,error}=await q;
    if(error){showToast('로드 실패','error');return;}
    allOrders=data||[];
    currentPage=1;
    renderTable();renderSummary();
    document.getElementById('filteredCount').textContent=allOrders.length;
}

function renderTable(){
    const tbody=document.getElementById('orderBody');
    const start=(currentPage-1)*PAGE_SIZE;
    const page=allOrders.slice(start,start+PAGE_SIZE);
    if(!allOrders.length){tbody.innerHTML='<tr><td colspan="13" style="text-align:center;color:#ccc;padding:40px;">조회된 주문 없음</td></tr>';document.getElementById('pagination').innerHTML='';return;}
    let lastDate='',html='';
    page.forEach(o=>{
        const qty=o.quantity||1;
        const amt=Math.round((o.price||0)*qty);
        const d=o.order_date||'';
        if(d!==lastDate){
            const dayOrders=allOrders.filter(x=>x.order_date===d);
            const dayQty=dayOrders.reduce((s,x)=>s+(x.quantity||1),0);
            const dayTotal=dayOrders.reduce((s,x)=>s+Math.round((x.price||0)*(x.quantity||1)),0);
            const dayProfit=dayOrders.reduce((s,x)=>{const p=getProfit(x);return s+(p||0);},0);
            const dayAd=Math.round(adMap[d]||0);
            const dayNet=dayProfit-dayAd;
            let dayInfo=`📅 ${d} (${dayOrders.length}건, ${dayQty}개, 매출 ${dayTotal.toLocaleString()}원`;
            if(dayProfit) dayInfo+=` / <span style="color:#0f9b58;font-weight:700;">순익 ${dayProfit.toLocaleString()}원</span>`;
            if(dayAd>0) dayInfo+=` - <span style="color:#e94560;">광고 ${dayAd.toLocaleString()}원</span> = <span style="color:#1976d2;font-weight:700;">최종 ${dayNet.toLocaleString()}원</span>`;
            dayInfo+=`)`;
            html+=`<tr><td colspan="13" class="date-group">${dayInfo}</td></tr>`;
            lastDate=d;
        }
        const unitCost=getCost(o);
        const unitProfit=unitCost!==null?Math.round((o.price||0)-(o.price||0)*(CR[o.platform]||0)-unitCost):null;
        const totalProfit=unitProfit!==null?unitProfit*qty:null;
        const costStr=unitCost!==null?`${Math.round(unitCost).toLocaleString()}`:'<span style="color:#ccc">-</span>';
        const unitProfitStr=unitProfit!==null?`<span style="color:${unitProfit>=0?'#0f9b58':'#e94560'}">${unitProfit.toLocaleString()}</span>`:'<span style="color:#ccc">-</span>';
        const profitStr=totalProfit!==null?`<span style="color:${totalProfit>=0?'#0f9b58':'#e94560'};font-weight:600;">${totalProfit.toLocaleString()}</span>`:'<span style="color:#ccc">-</span>';

        html+=`<tr>
            <td><input type="checkbox" class="row-check" value="${o.id}"></td>
            <td><span class="platform-badge" style="background:${PFC[o.platform]||'#999'}">${o.platform}</span></td>
            <td>${d}</td>
            <td title="${o.product}">${(o.product||'').substring(0,35)}</td>
            <td title="${o.option||''}">${(o.option||'').substring(0,20)||'-'}</td>
            <td class="text-center">${qty}</td>
            <td class="text-right amount">${Math.round(o.price||0).toLocaleString()}</td>
            <td class="text-right amount">${amt.toLocaleString()}</td>
            <td class="text-right" style="font-size:11px;">${costStr}</td>
            <td class="text-right" style="font-size:11px;">${unitProfitStr}</td>
            <td class="text-right">${profitStr}</td>
            <td>${(o.recipient||'').substring(0,6)||'-'}</td>
            <td style="font-size:11px;color:#999;">${(o.tracking||'').substring(0,15)||'-'}</td>
        </tr>`;
    });
    tbody.innerHTML=html;
    renderPagination();
}

function renderSummary(){
    const qty=allOrders.reduce((s,o)=>s+(o.quantity||1),0);
    const amt=allOrders.reduce((s,o)=>s+Math.round((o.price||0)*(o.quantity||1)),0);
    const totalProfit=allOrders.reduce((s,o)=>{const p=getProfit(o);return s+(p||0);},0);
    // 조회 기간 내 광고비 합산
    const dates=[...new Set(allOrders.map(o=>o.order_date))];
    const totalAd=dates.reduce((s,d)=>s+Math.round(adMap[d]||0),0);
    const netProfit=totalProfit-totalAd;
    const margin=amt>0?Math.round(netProfit/amt*100):0;
    let summary=`<div>총 <strong>${allOrders.length}건</strong></div><div>수량 <strong>${qty.toLocaleString()}개</strong></div><div>매출 <strong>${amt.toLocaleString()}원</strong></div><div>순익 <strong style="color:#0f9b58">${totalProfit.toLocaleString()}원</strong></div>`;
    if(totalAd>0) summary+=`<div>광고 <strong style="color:#e94560">-${totalAd.toLocaleString()}원</strong></div><div>최종 <strong style="color:#1976d2">${netProfit.toLocaleString()}원</strong> <span style="font-size:11px;color:#888;">(${margin}%)</span></div>`;
    else summary+=`<div style="font-size:11px;color:#888;">마진 ${amt>0?Math.round(totalProfit/amt*100):0}%</div>`;
    document.getElementById('summaryBar').innerHTML=summary;
}

function renderPagination(){
    const tp=Math.ceil(allOrders.length/PAGE_SIZE);
    if(tp<=1){document.getElementById('pagination').innerHTML='';return;}
    let h=`<button ${currentPage===1?'disabled':''} onclick="goPage(${currentPage-1})">◀</button>`;
    for(let p=Math.max(1,currentPage-3);p<=Math.min(tp,currentPage+3);p++)h+=`<button class="${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`;
    h+=`<button ${currentPage===tp?'disabled':''} onclick="goPage(${currentPage+1})">▶</button><span class="page-info">${currentPage}/${tp}</span>`;
    document.getElementById('pagination').innerHTML=h;
}
function goPage(p){currentPage=p;renderTable();window.scrollTo(0,0);}
function toggleAll(){const c=document.getElementById('checkAll').checked;document.querySelectorAll('.row-check').forEach(cb=>cb.checked=c);}

// ── 삭제: 선택 ──
async function deleteSelected(){
    const ids=[...document.querySelectorAll('.row-check:checked')].map(cb=>Number(cb.value));
    if(!ids.length){showToast('삭제할 항목을 선택해주세요','info');return;}
    showDeleteModal(`선택한 주문을 삭제합니다.`,ids.length+'건',async()=>{
        for(let i=0;i<ids.length;i+=100){
            await db.from('orders').delete().in('id',ids.slice(i,i+100));
        }
        showToast(`${ids.length}건 삭제 완료`,'success');
        document.getElementById('checkAll').checked=false;
        loadOrders();
    });
}

// ── 삭제: 조회 결과 전체 ──
async function deleteFiltered(){
    if(!allOrders.length){showToast('삭제할 주문이 없습니다','info');return;}
    const pf=document.getElementById('filterPlatform').value;
    const from=document.getElementById('filterFrom').value;
    const to=document.getElementById('filterTo').value;
    const label=`${pf==='전체'?'전체 플랫폼':pf} / ${from} ~ ${to}`;
    
    showDeleteModal(`조회된 주문을 모두 삭제합니다.\n[${label}]`,allOrders.length+'건',async()=>{
        const ids=allOrders.map(o=>o.id);
        for(let i=0;i<ids.length;i+=100){
            await db.from('orders').delete().in('id',ids.slice(i,i+100));
        }
        showToast(`${ids.length}건 삭제 완료`,'success');
        loadOrders();
    });
}

// ── 삭제: DB 전체 ──
async function deleteAll(){
    const{count}=await db.from('orders').select('*',{count:'exact',head:true});
    showDeleteModal(`⚠️ DB의 모든 주문 데이터를 삭제합니다.\n원가/광고비 데이터는 유지됩니다.`,count+'건',async()=>{
        await db.from('orders').delete().neq('id',0);
        showToast(`전체 ${count}건 삭제 완료`,'success');
        loadOrders();
    });
}

// ── 모달 ──
function showDeleteModal(msg,countText,onConfirm){
    document.getElementById('deleteMsg').textContent=msg;
    document.getElementById('deleteCount').textContent=countText;
    document.getElementById('deleteModal').classList.add('show');
    document.getElementById('deleteConfirmBtn').onclick=()=>{closeModal();onConfirm();};
}
function closeModal(){document.getElementById('deleteModal').classList.remove('show');}

function showToast(msg,type='info'){const el=document.getElementById('toast');el.textContent=msg;el.className='toast '+type+' show';setTimeout(()=>el.classList.remove('show'),3000);}

if(window.self!==window.top){document.querySelectorAll('.header').forEach(el=>el.style.display='none');const c=document.querySelector('.container');if(c)c.style.paddingTop='12px';}
document.addEventListener('DOMContentLoaded',()=>{initDates();loadOrders();});
</script>
</body>
</html>
