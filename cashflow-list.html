<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>입출금 관리 - 거래 목록</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:#EDE8DF;min-height:100vh;}
.header{background:#1a1a2e;color:white;padding:20px 32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.header h1{font-size:20px;font-weight:700;}.header h1 span{color:#f4a900;}
.container{max-width:1200px;margin:0 auto;padding:24px;}
.card{background:#fff;border-radius:14px;padding:24px;border:1px solid #D9D4CA;margin-bottom:20px;}
.card-title{font-size:16px;font-weight:700;color:#1a1a2e;margin-bottom:16px;display:flex;align-items:center;gap:8px;}

/* 요약 카드 */
.summary-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;}
.stat-card{background:#fff;border-radius:12px;padding:14px;border:1px solid #D9D4CA;text-align:center;}
.stat-label{font-size:10px;color:#888;font-weight:600;margin-bottom:4px;}
.stat-value{font-size:18px;font-weight:800;}

/* 필터 */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.filter-bar select,.filter-bar input{padding:8px 12px;border:1.5px solid #D9D4CA;border-radius:8px;font-family:'Noto Sans KR',sans-serif;font-size:13px;background:#fff;}
.filter-bar select:focus,.filter-bar input:focus{outline:none;border-color:#f4a900;}
.filter-bar label{font-size:12px;font-weight:600;color:#555;display:flex;align-items:center;gap:6px;}
.unclassified-badge{background:#e94560;color:white;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:700;margin-left:4px;}

/* 테이블 */
.tx-table{width:100%;border-collapse:collapse;font-size:12px;}
.tx-table th{background:#f5f0e8;padding:10px 6px;text-align:center;font-weight:600;color:#555;border-bottom:2px solid #D9D4CA;font-size:11px;position:sticky;top:0;z-index:2;}
.tx-table td{padding:8px 6px;border-bottom:1px solid #f0ebe3;text-align:center;vertical-align:middle;}
.tx-table tr:hover td{background:#faf8f4;}
.tx-table tr.unclassified{background:#fff8e1;}
.tx-table tr.unclassified:hover td{background:#fff3c4;}

.amount-in{color:#0f9b58;font-weight:700;}
.amount-out{color:#e94560;font-weight:700;}
.bank-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;color:white;}
.bank-hana{background:#009688;}.bank-kb{background:#eab308;color:#1a1a2e;}.bank-nh{background:#2196f3;}
.cat-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;}
.cat-confirmed{background:#e8f5e9;color:#2e7d32;}
.cat-auto{background:#e3f2fd;color:#1565c0;}
.cat-unclassified{background:#fce4ec;color:#c62828;}
.cat-review{background:#fff8e1;color:#f57f17;}

/* 수동 분류 */
.classify-select{padding:4px 8px;border:1.5px solid #f4a900;border-radius:6px;font-family:'Noto Sans KR',sans-serif;font-size:11px;background:#fff;cursor:pointer;max-width:140px;}
.classify-select:focus{outline:none;box-shadow:0 0 0 2px rgba(244,169,0,0.2);}
.btn-save{padding:4px 10px;border:none;border-radius:6px;font-family:'Noto Sans KR',sans-serif;font-size:10px;font-weight:700;cursor:pointer;background:#0f9b58;color:white;}
.btn-save:hover{background:#0a7a45;}
.cb-rule{accent-color:#f4a900;margin-right:2px;}

/* 페이지네이션 */
.pagination{display:flex;justify-content:center;gap:6px;margin-top:16px;}
.page-btn{padding:6px 14px;border:1px solid #D9D4CA;border-radius:8px;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:600;cursor:pointer;background:#fff;}
.page-btn:hover{background:#f5f0e8;}.page-btn.active{background:#f4a900;color:#1a1a2e;border-color:#f4a900;}
.page-info{font-size:12px;color:#888;text-align:center;margin-top:8px;}

.no-data{text-align:center;padding:40px;color:#bbb;font-size:14px;}
.toast{position:fixed;bottom:30px;right:30px;padding:14px 24px;border-radius:10px;color:white;font-size:13px;font-weight:600;opacity:0;transform:translateY(20px);transition:all 0.3s;z-index:1000;}
.toast.show{opacity:1;transform:translateY(0);}.toast.success{background:#0f9b58;}.toast.info{background:#1976d2;}
@media(max-width:768px){.summary-grid{grid-template-columns:repeat(3,1fr);}.filter-bar{flex-direction:column;align-items:stretch;}}
</style>
</head>
<body>
<div class="header"><h1>📋 거래 목록 / <span>수동 분류</span></h1></div>
<div class="container">
    <div class="summary-grid" id="summaryGrid"></div>

    <div class="card">
        <div class="filter-bar">
            <label>통장: <select id="filterAccount"><option value="">전체</option></select></label>
            <label>분류: <select id="filterCategory">
                <option value="">전체</option>
                <option value="__unclassified__">⚠️ 미분류만</option>
                <option value="__review__">🔍 검토필요만</option>
                <option value="매출">매출</option>
                <option value="사업지출">사업지출</option>
                <option value="고정비">고정비</option>
                <option value="통장간이체">통장간이체</option>
            </select></label>
            <label>기간: <input type="date" id="filterFrom"> ~ <input type="date" id="filterTo"></label>
            <label>검색: <input type="text" id="filterSearch" placeholder="거래처/적요" style="width:140px;"></label>
        </div>

        <div style="max-height:600px;overflow-y:auto;">
            <table class="tx-table">
                <thead><tr>
                    <th>통장</th><th>날짜</th><th>거래처/적요</th><th>입금</th><th>출금</th><th>잔액</th><th>분류</th><th>상태</th><th>메모</th><th>수동 분류</th>
                </tr></thead>
                <tbody id="txBody"><tr><td colspan="10" class="no-data">로딩 중...</td></tr></tbody>
            </table>
        </div>
        <div class="pagination" id="pagination"></div>
        <div class="page-info" id="pageInfo"></div>
    </div>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL='https://hayfpcuacwkytbjwjdhm.supabase.co';
const SUPABASE_KEY='sb_publishable_OnGhN5iA72Y6H0jmTu82tg_Vv9VJyI7';
const{createClient}=window.supabase;
const db=createClient(SUPABASE_URL,SUPABASE_KEY);

const CATEGORIES=[
    {cat:'매출',sub:'네이버 정산'},{cat:'매출',sub:'오늘의집 정산'},{cat:'매출',sub:'아이디어스 정산'},{cat:'매출',sub:'쿠팡 정산'},{cat:'매출',sub:'네이버페이 환불'},
    {cat:'사업지출',sub:'택배비'},{cat:'사업지출',sub:'원재료(편백)'},{cat:'사업지출',sub:'원재료(목재)'},{cat:'사업지출',sub:'외주(프리랜서)'},
    {cat:'사업지출',sub:'포장재'},{cat:'사업지출',sub:'세금(국세)'},{cat:'사업지출',sub:'카드결제대금'},{cat:'사업지출',sub:'구독/SaaS'},{cat:'사업지출',sub:'기타'},
    {cat:'고정비',sub:'통신비'},{cat:'고정비',sub:'보험'},{cat:'고정비',sub:'임대료'},{cat:'고정비',sub:'기타'},
    {cat:'통장간이체',sub:'본인 이체'},{cat:'통장간이체',sub:'택배비 충당이체'},{cat:'통장간이체',sub:'저축 이체'},
    {cat:'개인',sub:'생활비'},{cat:'개인',sub:'투자/적금'},{cat:'개인',sub:'기타'},
    {cat:'플랫폼결제',sub:'네이버페이(검토필요)'},{cat:'플랫폼결제',sub:'쿠팡(검토필요)'},{cat:'플랫폼결제',sub:'카카오페이(검토필요)'},
];

let accounts=[];
let allTxs=[];
let filteredTxs=[];
const PAGE_SIZE=50;
let currentPage=1;

async function init(){
    const{data:accts}=await db.from('bank_accounts').select('*').order('id');
    accounts=accts||[];
    const sel=document.getElementById('filterAccount');
    accounts.forEach(a=>{const o=document.createElement('option');o.value=a.id;o.textContent=`${a.bank} (${a.name})`;sel.appendChild(o);});

    // 기본 기간: 이번달
    const now=new Date();
    document.getElementById('filterFrom').value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
    document.getElementById('filterTo').value=now.toISOString().slice(0,10);

    await loadTransactions();

    // 필터 이벤트
    ['filterAccount','filterCategory'].forEach(id=>document.getElementById(id).addEventListener('change',applyFilters));
    ['filterFrom','filterTo'].forEach(id=>document.getElementById(id).addEventListener('change',loadTransactions));
    document.getElementById('filterSearch').addEventListener('input',debounce(applyFilters,300));
}

async function loadTransactions(){
    const from=document.getElementById('filterFrom').value;
    const to=document.getElementById('filterTo').value;

    const PAGE=1000;let all=[],offset=0;
    while(true){
        let q=db.from('cash_transactions').select('*');
        if(from)q=q.gte('tx_date',from);
        if(to)q=q.lte('tx_date',to);
        q=q.order('tx_date',{ascending:false}).order('id',{ascending:false});
        const{data}=await q.range(offset,offset+PAGE-1);
        if(!data||!data.length)break;
        all=all.concat(data);
        if(data.length<PAGE)break;
        offset+=PAGE;
    }
    allTxs=all;
    applyFilters();
}

function applyFilters(){
    const accountId=document.getElementById('filterAccount').value;
    const catFilter=document.getElementById('filterCategory').value;
    const search=document.getElementById('filterSearch').value.toLowerCase();

    filteredTxs=allTxs.filter(tx=>{
        if(accountId&&tx.account_id!=accountId)return false;
        if(catFilter==='__unclassified__'&&(tx.category||tx.is_confirmed))return false;
        if(catFilter==='__unclassified__'&&!tx.category&&!tx.is_confirmed)return true;
        if(catFilter==='__review__'&&!(tx.sub_category||'').includes('검토필요'))return false;
        if(catFilter&&catFilter!=='__unclassified__'&&catFilter!=='__review__'&&tx.category!==catFilter)return false;
        if(search&&!(tx.counterparty||'').toLowerCase().includes(search)&&!(tx.raw_description||'').toLowerCase().includes(search)&&!(tx.memo||'').toLowerCase().includes(search))return false;
        return true;
    });

    currentPage=1;
    renderSummary();
    renderTable();
}

function renderSummary(){
    const total=filteredTxs.length;
    const totalIn=filteredTxs.filter(t=>(t.deposit||0)>0).reduce((s,t)=>s+(t.deposit||0),0);
    const totalOut=filteredTxs.filter(t=>(t.withdraw||0)>0).reduce((s,t)=>s+(t.withdraw||0),0);
    const unclassified=filteredTxs.filter(t=>!t.category&&!t.is_confirmed).length;
    const review=filteredTxs.filter(t=>(t.sub_category||'').includes('검토필요')).length;

    document.getElementById('summaryGrid').innerHTML=`
        <div class="stat-card"><div class="stat-label">전체 건수</div><div class="stat-value" style="color:#1976d2">${total}건</div></div>
        <div class="stat-card"><div class="stat-label">총 입금</div><div class="stat-value" style="color:#0f9b58">+${fmt(totalIn)}</div></div>
        <div class="stat-card"><div class="stat-label">총 출금</div><div class="stat-value" style="color:#e94560">-${fmt(totalOut)}</div></div>
        <div class="stat-card"><div class="stat-label">미분류</div><div class="stat-value" style="color:#c62828">${unclassified}건</div></div>
        <div class="stat-card"><div class="stat-label">검토필요</div><div class="stat-value" style="color:#f57f17">${review}건</div></div>`;
}

function renderTable(){
    const start=(currentPage-1)*PAGE_SIZE;
    const page=filteredTxs.slice(start,start+PAGE_SIZE);
    const tbody=document.getElementById('txBody');

    if(!page.length){tbody.innerHTML='<tr><td colspan="10" class="no-data">거래 내역이 없습니다</td></tr>';renderPagination();return;}

    tbody.innerHTML=page.map(tx=>{
        const acct=accounts.find(a=>a.id===tx.account_id);
        const bankClass=acct?getBankClass(acct.bank):'';
        const bankName=acct?acct.bank:'?';
        const isUnclassified=!tx.category&&!tx.is_confirmed;
        const isReview=(tx.sub_category||'').includes('검토필요');
        const rowClass=isUnclassified?'unclassified':'';

        const amtIn=(tx.deposit||0)>0?`<span class="amount-in">+${fmt(tx.deposit)}</span>`:'';
        const amtOut=(tx.withdraw||0)>0?`<span class="amount-out">-${fmt(tx.withdraw)}</span>`:'';

        let statusBadge='';
        if(tx.is_confirmed)statusBadge='<span class="cat-badge cat-confirmed">확인됨</span>';
        else if(tx.is_auto_categorized)statusBadge='<span class="cat-badge cat-auto">자동</span>';
        else if(isReview)statusBadge='<span class="cat-badge cat-review">검토</span>';
        else statusBadge='<span class="cat-badge cat-unclassified">미분류</span>';

        const catDisplay=tx.category?`${tx.category}${tx.sub_category?' / '+tx.sub_category:''}`:'-';

        // 수동 분류 UI
        let classifyUI='';
        if(!tx.is_confirmed||isUnclassified||isReview){
            const options=CATEGORIES.map(c=>{
                const val=`${c.cat}|${c.sub}`;
                const selected=(tx.category===c.cat&&tx.sub_category===c.sub)?'selected':'';
                return `<option value="${val}" ${selected}>${c.cat} / ${c.sub}</option>`;
            }).join('');
            classifyUI=`<div style="display:flex;gap:4px;align-items:center;">
                <select class="classify-select" data-id="${tx.id}" onchange="classifyTx(this)">
                    <option value="">선택...</option>${options}
                </select>
                <label style="font-size:9px;color:#888;white-space:nowrap;"><input type="checkbox" class="cb-rule" data-id="${tx.id}" title="같은 적요 자동분류">룰</label>
            </div>`;
        }else{
            classifyUI='<span style="font-size:10px;color:#aaa;">-</span>';
        }

        return `<tr class="${rowClass}">
            <td><span class="bank-badge ${bankClass}">${bankName}</span></td>
            <td style="font-size:11px;white-space:nowrap;">${tx.tx_date}</td>
            <td style="text-align:left;font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${tx.raw_description||tx.counterparty||''}">${tx.counterparty||'-'}</td>
            <td>${amtIn}</td><td>${amtOut}</td>
            <td style="font-size:11px;">${tx.balance_after?fmt(tx.balance_after):'-'}</td>
            <td style="font-size:10px;">${catDisplay}</td>
            <td>${statusBadge}</td>
            <td><input type="text" class="memo-input" data-id="${tx.id}" value="${(tx.memo||'').replace(/"/g,'&quot;')}" placeholder="메모 입력" onchange="saveMemo(this)" style="padding:3px 6px;border:1px solid #e0e0e0;border-radius:5px;font-size:10px;width:100px;font-family:'Noto Sans KR',sans-serif;"></td>
            <td>${classifyUI}</td>
        </tr>`;
    }).join('');

    renderPagination();
}

async function saveMemo(el){
    const txId=Number(el.dataset.id);
    const memo=el.value.trim();
    const{error}=await db.from('cash_transactions').update({memo}).eq('id',txId);
    if(error){showToast('메모 저장 실패','error');}
    else{
        const tx=allTxs.find(t=>t.id===txId);if(tx)tx.memo=memo;
        showToast('메모 저장!','success');
    }
}

async function classifyTx(selectEl){
    const txId=Number(selectEl.dataset.id);
    const val=selectEl.value;
    if(!val)return;

    const[cat,sub]=val.split('|');
    const ruleCheckbox=document.querySelector(`.cb-rule[data-id="${txId}"]`);
    const addRule=ruleCheckbox&&ruleCheckbox.checked;

    // DB 업데이트
    const{error}=await db.from('cash_transactions').update({
        category:cat,sub_category:sub,is_confirmed:true,is_auto_categorized:false
    }).eq('id',txId);

    if(error){showToast('저장 실패: '+error.message,'error');return;}

    // 룰 추가
    if(addRule){
        const tx=allTxs.find(t=>t.id===txId);
        if(tx&&tx.counterparty){
            await db.from('categorization_rules').upsert({
                keyword:tx.counterparty.toLowerCase(),
                category:cat,sub_category:sub,
                priority:60,hit_count:0,
                created_from_tx_id:txId
            },{onConflict:'keyword,category,sub_category'});
            showToast(`"${tx.counterparty}" → ${cat}/${sub} 룰 저장!`,'success');
        }
    }else{
        showToast('분류 완료!','success');
    }

    // 로컬 데이터 업데이트
    const tx=allTxs.find(t=>t.id===txId);
    if(tx){tx.category=cat;tx.sub_category=sub;tx.is_confirmed=true;tx.is_auto_categorized=false;}
    applyFilters();
}

function renderPagination(){
    const totalPages=Math.ceil(filteredTxs.length/PAGE_SIZE);
    const el=document.getElementById('pagination');
    if(totalPages<=1){el.innerHTML='';document.getElementById('pageInfo').textContent='';return;}

    let html='';
    if(currentPage>1)html+=`<button class="page-btn" onclick="goPage(${currentPage-1})">◀</button>`;
    const start=Math.max(1,currentPage-3),end=Math.min(totalPages,currentPage+3);
    for(let i=start;i<=end;i++){
        html+=`<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
    }
    if(currentPage<totalPages)html+=`<button class="page-btn" onclick="goPage(${currentPage+1})">▶</button>`;
    el.innerHTML=html;

    const from=(currentPage-1)*PAGE_SIZE+1;
    const to=Math.min(currentPage*PAGE_SIZE,filteredTxs.length);
    document.getElementById('pageInfo').textContent=`${from}~${to} / 총 ${filteredTxs.length}건`;
}

function goPage(p){currentPage=p;renderTable();window.scrollTo(0,200);}

function getBankClass(bank){return bank==='하나'?'bank-hana':bank==='KB국민'?'bank-kb':bank==='농협'?'bank-nh':'';}
function fmt(n){return Math.round(n).toLocaleString('ko-KR');}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}
function showToast(m,t){const e=document.getElementById('toast');e.textContent=m;e.className='toast '+(t||'info')+' show';setTimeout(()=>e.classList.remove('show'),2500);}

if(window.self!==window.top){document.querySelectorAll('.header').forEach(el=>el.style.display='none');}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
