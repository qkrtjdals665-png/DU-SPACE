<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주문관리 - 광고비 관리</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:#EDE8DF;min-height:100vh;}
.header{background:#1a1a2e;color:white;padding:20px 32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.header h1{font-size:20px;font-weight:700;}.header h1 span{color:#f4a900;}
.nav-links{display:flex;gap:8px;}
.nav-links a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:13px;padding:8px 16px;border-radius:8px;background:rgba(255,255,255,0.1);}
.container{max-width:1100px;margin:0 auto;padding:24px;}
.month-nav{display:flex;align-items:center;gap:8px;background:#fff;padding:14px 20px;border-radius:14px;border:1px solid #D9D4CA;margin-bottom:16px;}
.month-nav button{padding:8px 18px;border:none;border-radius:8px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
.month-nav .nav-btn{background:#f5f0e8;color:#555;}.month-nav .current-btn{background:#f4a900;color:#1a1a2e;}
.month-label{font-size:18px;font-weight:700;min-width:140px;text-align:center;}
.summary-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
.sc{background:#fff;border-radius:14px;padding:16px;border:1px solid #D9D4CA;text-align:center;}
.sc .sc-label{font-size:11px;color:#888;font-weight:600;margin-bottom:4px;}
.sc .sc-value{font-size:18px;font-weight:800;}
.tabs{display:flex;gap:4px;margin-bottom:0;}
.tab-btn{padding:12px 24px;border:none;border-radius:12px 12px 0 0;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:600;cursor:pointer;background:#d9d4ca;color:#888;}
.tab-btn.active{background:#fff;color:#1a1a2e;}
.tab-content{display:none;background:#fff;border-radius:0 14px 14px 14px;padding:24px;border:1px solid #D9D4CA;}
.tab-content.active{display:block;}
.form-row{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:16px;}
.form-group{display:flex;flex-direction:column;gap:4px;}
.form-group label{font-size:12px;font-weight:600;color:#666;}
.form-group input,.form-group select{padding:8px 12px;border:1.5px solid #D9D4CA;border-radius:8px;font-family:'Noto Sans KR',sans-serif;font-size:13px;}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#f4a900;}
.btn{padding:8px 18px;border:none;border-radius:8px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
.btn-primary{background:#1a1a2e;color:white;}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:16px;}
thead th{background:#f5f0e8;padding:10px 8px;text-align:center;font-weight:600;color:#555;border-bottom:2px solid #D9D4CA;}
tbody td{padding:8px;border-bottom:1px solid #f0ebe3;text-align:center;}
tbody tr:hover td{background:#faf8f4;}
.amount{font-variant-numeric:tabular-nums;font-weight:600;}
.platform-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;color:white;}
.del-btn{background:none;border:none;color:#ccc;cursor:pointer;font-size:16px;padding:4px 8px;border-radius:4px;}
.del-btn:hover{color:#e94560;background:#fef0f3;}
.toast{position:fixed;bottom:24px;right:24px;padding:14px 24px;border-radius:10px;font-size:13px;font-weight:600;color:white;opacity:0;transform:translateY(20px);transition:all 0.3s;z-index:1000;}
.toast.show{opacity:1;transform:translateY(0);}.toast.success{background:#0f9b58;}.toast.error{background:#e94560;}.toast.info{background:#4285f4;}
@media(max-width:768px){.summary-cards{grid-template-columns:1fr 1fr;}.form-row{flex-direction:column;}}
</style>
</head>
<body>
<div class="header">
    <h1>📢 광고비 <span>관리</span></h1>
    <div class="nav-links"><a href="order-dashboard.html">📊 대시보드</a><a href="order-daily.html">📈 일별매출</a></div>
</div>
<div class="container">
    <div class="month-nav">
        <button class="nav-btn" onclick="changeMonth(-1)">◀ 이전달</button>
        <div class="month-label" id="monthLabel"></div>
        <button class="nav-btn" onclick="changeMonth(1)">다음달 ▶</button>
        <button class="current-btn" onclick="goCurrentMonth()">이번달</button>
    </div>
    <div class="summary-cards" id="summaryCards"></div>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('daily')">📅 일별 광고비</button>
        <button class="tab-btn" onclick="switchTab('period')">📆 기간 광고비</button>
    </div>
    <!-- 일별 -->
    <div class="tab-content active" id="tab-daily">
        <h3 style="font-size:15px;margin-bottom:16px;color:#555;">일별 광고비 (검색광고 등)</h3>
        <div class="form-row">
            <div class="form-group"><label>날짜</label><input type="date" id="dailyDate"></div>
            <div class="form-group"><label>플랫폼</label><select id="dailyPlatform"><option>네이버</option><option>쿠팡</option><option>오늘의집</option><option>아이디어스</option></select></div>
            <div class="form-group"><label>금액 (원)</label><input type="text" id="dailyCost" placeholder="10,000" oninput="fmtInput(this)"></div>
            <button class="btn btn-primary" onclick="addDailyAd()">➕ 추가</button>
        </div>
        <table><thead><tr><th>날짜</th><th>플랫폼</th><th>금액</th><th>삭제</th></tr></thead>
        <tbody id="dailyBody"><tr><td colspan="4" style="color:#ccc;padding:30px;">로딩 중...</td></tr></tbody></table>
    </div>
    <!-- 기간 -->
    <div class="tab-content" id="tab-period">
        <h3 style="font-size:15px;margin-bottom:16px;color:#555;">기간 광고비 (트래픽 프로그램 등)</h3>
        <div class="form-row">
            <div class="form-group"><label>시작일</label><input type="date" id="periodStart"></div>
            <div class="form-group"><label>종료일</label><input type="date" id="periodEnd"></div>
            <div class="form-group"><label>플랫폼</label><select id="periodPlatform"><option>네이버</option><option>쿠팡</option><option>오늘의집</option><option>아이디어스</option></select></div>
            <div class="form-group"><label>총 금액</label><input type="text" id="periodCost" placeholder="100,000" oninput="fmtInput(this)"></div>
            <div class="form-group"><label>설명</label><input type="text" id="periodDesc" placeholder="트래픽 프로그램"></div>
            <button class="btn btn-primary" onclick="addPeriodAd()">➕ 추가</button>
        </div>
        <table><thead><tr><th>기간</th><th>플랫폼</th><th>총액</th><th>일평균</th><th>설명</th><th>삭제</th></tr></thead>
        <tbody id="periodBody"><tr><td colspan="6" style="color:#ccc;padding:30px;">로딩 중...</td></tr></tbody></table>
    </div>
</div>
<div class="toast" id="toast"></div>
<script>
const SUPABASE_URL='https://hayfpcuacwkytbjwjdhm.supabase.co';
const SUPABASE_KEY='sb_publishable_OnGhN5iA72Y6H0jmTu82tg_Vv9VJyI7';
const {createClient}=window.supabase;
const db=createClient(SUPABASE_URL,SUPABASE_KEY);
const PFC={"네이버":"#00C73C","쿠팡":"#E31837","오늘의집":"#35C5F0","아이디어스":"#FF6F61"};

let currentDate=new Date();
function updateMonthLabel(){document.getElementById('monthLabel').textContent=`${currentDate.getFullYear()}년 ${currentDate.getMonth()+1}월`;}
function changeMonth(dir){currentDate.setMonth(currentDate.getMonth()+dir);updateMonthLabel();loadAll();}
function goCurrentMonth(){currentDate=new Date();updateMonthLabel();loadAll();}
function getMonthRange(){
    const y=currentDate.getFullYear(),m=currentDate.getMonth();
    return{start:`${y}-${String(m+1).padStart(2,'0')}-01`,end:`${y}-${String(m+1).padStart(2,'0')}-${String(new Date(y,m+1,0).getDate()).padStart(2,'0')}`};
}

function switchTab(tab){
    document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',i===(tab==='daily'?0:1)));
    document.getElementById('tab-daily').classList.toggle('active',tab==='daily');
    document.getElementById('tab-period').classList.toggle('active',tab==='period');
}

function fmtInput(el){let v=el.value.replace(/[^\d]/g,'');el.value=v?parseInt(v).toLocaleString():'';}
function parseNum(s){return parseInt((s||'0').replace(/[^\d]/g,''))||0;}

// ── 일별 광고비 ──
async function addDailyAd(){
    const date=document.getElementById('dailyDate').value;
    const platform=document.getElementById('dailyPlatform').value;
    const cost=parseNum(document.getElementById('dailyCost').value);
    if(!date||!cost){showToast('날짜와 금액을 입력해주세요','error');return;}
    const {error}=await db.from('ad_costs').upsert({ad_date:date,platform,cost},{onConflict:'ad_date,platform'});
    if(error){showToast('추가 실패: '+error.message,'error');return;}
    document.getElementById('dailyCost').value='';
    showToast('광고비 추가 완료!','success');
    loadAll();
}

async function deleteDailyAd(id){
    if(!confirm('삭제하시겠습니까?')) return;
    await db.from('ad_costs').delete().eq('id',id);
    showToast('삭제됨','info');loadAll();
}

async function loadDailyAds(){
    const {start,end}=getMonthRange();
    const {data}=await db.from('ad_costs').select('*').gte('ad_date',start).lte('ad_date',end).order('ad_date',{ascending:false});
    const tbody=document.getElementById('dailyBody');
    if(!data||data.length===0){tbody.innerHTML='<tr><td colspan="4" style="color:#ccc;padding:30px;">이 달의 일별 광고비 없음</td></tr>';return data||[];}
    tbody.innerHTML=data.map(d=>`<tr>
        <td>${d.ad_date}</td>
        <td><span class="platform-badge" style="background:${PFC[d.platform]||'#999'}">${d.platform}</span></td>
        <td class="amount">${Math.round(d.cost).toLocaleString()}원</td>
        <td><button class="del-btn" onclick="deleteDailyAd(${d.id})">✕</button></td>
    </tr>`).join('');
    return data;
}

// ── 기간 광고비 ──
async function addPeriodAd(){
    const start=document.getElementById('periodStart').value;
    const end=document.getElementById('periodEnd').value;
    const platform=document.getElementById('periodPlatform').value;
    const cost=parseNum(document.getElementById('periodCost').value);
    const desc=document.getElementById('periodDesc').value;
    if(!start||!end||!cost){showToast('기간과 금액을 입력해주세요','error');return;}
    const {error}=await db.from('product_ad_costs').insert({ad_type:'period',platform,product:'',option:'',start_date:start,end_date:end,total_cost:cost,description:desc});
    if(error){showToast('추가 실패: '+error.message,'error');return;}
    document.getElementById('periodCost').value='';
    document.getElementById('periodDesc').value='';
    showToast('기간 광고비 추가!','success');
    loadAll();
}

async function deletePeriodAd(id){
    if(!confirm('삭제하시겠습니까?')) return;
    await db.from('product_ad_costs').delete().eq('id',id);
    showToast('삭제됨','info');loadAll();
}

async function loadPeriodAds(){
    const {start,end}=getMonthRange();
    // 해당 월과 겹치는 기간 광고
    const {data}=await db.from('product_ad_costs').select('*').lte('start_date',end).gte('end_date',start).order('start_date',{ascending:false});
    const tbody=document.getElementById('periodBody');
    if(!data||data.length===0){tbody.innerHTML='<tr><td colspan="6" style="color:#ccc;padding:30px;">이 달의 기간 광고비 없음</td></tr>';return data||[];}
    tbody.innerHTML=data.map(d=>{
        const days=Math.max(1,Math.ceil((new Date(d.end_date)-new Date(d.start_date))/(86400000))+1);
        const daily=Math.round(d.total_cost/days);
        return `<tr>
            <td style="font-size:12px;">${d.start_date} ~ ${d.end_date}<br><span style="color:#888;font-size:11px;">(${days}일)</span></td>
            <td><span class="platform-badge" style="background:${PFC[d.platform]||'#999'}">${d.platform}</span></td>
            <td class="amount">${Math.round(d.total_cost).toLocaleString()}원</td>
            <td class="amount" style="color:#f4a900">${daily.toLocaleString()}원/일</td>
            <td style="font-size:12px;color:#666;">${d.description||'-'}</td>
            <td><button class="del-btn" onclick="deletePeriodAd(${d.id})">✕</button></td>
        </tr>`;
    }).join('');
    return data;
}

// ── 요약 ──
async function loadAll(){
    const dailyData=await loadDailyAds();
    const periodData=await loadPeriodAds();
    const {start,end}=getMonthRange();

    // 일별 합계
    const dailyTotal=(dailyData||[]).reduce((s,d)=>s+(d.cost||0),0);

    // 기간 광고 해당 월 비용 계산
    let periodTotal=0;
    (periodData||[]).forEach(d=>{
        const pStart=new Date(d.start_date),pEnd=new Date(d.end_date);
        const mStart=new Date(start),mEnd=new Date(end);
        const overlapStart=new Date(Math.max(pStart,mStart));
        const overlapEnd=new Date(Math.min(pEnd,mEnd));
        const overlapDays=Math.max(0,Math.ceil((overlapEnd-overlapStart)/(86400000))+1);
        const totalDays=Math.max(1,Math.ceil((pEnd-pStart)/(86400000))+1);
        periodTotal+=(d.total_cost/totalDays)*overlapDays;
    });

    const grandTotal=dailyTotal+periodTotal;
    const m=currentDate.getMonth()+1;

    document.getElementById('summaryCards').innerHTML=`
        <div class="sc"><div class="sc-label">${m}월 일별 광고비</div><div class="sc-value" style="color:#E31837">${Math.round(dailyTotal).toLocaleString()}원</div></div>
        <div class="sc"><div class="sc-label">${m}월 기간 광고비</div><div class="sc-value" style="color:#f4a900">${Math.round(periodTotal).toLocaleString()}원</div></div>
        <div class="sc"><div class="sc-label">${m}월 총 광고비</div><div class="sc-value" style="color:#e94560">${Math.round(grandTotal).toLocaleString()}원</div></div>
        <div class="sc"><div class="sc-label">일평균 광고비</div><div class="sc-value" style="color:#9b59b6">${Math.round(grandTotal/new Date(currentDate.getFullYear(),currentDate.getMonth()+1,0).getDate()).toLocaleString()}원</div></div>
    `;
}

function showToast(msg,type='info'){const el=document.getElementById('toast');el.textContent=msg;el.className='toast '+type+' show';setTimeout(()=>el.classList.remove('show'),3000);}

if(window.self!==window.top){document.querySelectorAll('.header').forEach(el=>el.style.display='none');const c=document.querySelector('.container');if(c)c.style.paddingTop='12px';}

document.addEventListener('DOMContentLoaded',()=>{
    document.getElementById('dailyDate').value=new Date().toISOString().slice(0,10);
    document.getElementById('periodStart').value=new Date().toISOString().slice(0,10);
    const d=new Date();d.setDate(d.getDate()+9);
    document.getElementById('periodEnd').value=d.toISOString().slice(0,10);
    updateMonthLabel();loadAll();
});
</script>
</body>
</html>
