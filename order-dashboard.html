<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주문관리 - 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #EDE8DF;
    color: #2c2c2c;
    min-height: 100vh;
}

/* ── 헤더 ── */
.header {
    background: #1a1a2e;
    color: white;
    padding: 20px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
}

.header h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
}

.header h1 span { color: #f4a900; }

.month-nav {
    display: flex;
    align-items: center;
    gap: 8px;
}

.month-nav button {
    padding: 8px 18px;
    border: none;
    border-radius: 8px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
}

.month-nav button:hover { transform: translateY(-1px); }

.month-nav .nav-btn {
    background: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.85);
}

.month-nav .nav-btn:hover { background: rgba(255,255,255,0.2); }

.month-nav .current-btn {
    background: #f4a900;
    color: #1a1a2e;
}

.month-label {
    font-size: 18px;
    font-weight: 700;
    min-width: 140px;
    text-align: center;
}

.refresh-btn {
    padding: 8px 20px;
    background: rgba(255,255,255,0.12);
    color: white;
    border: none;
    border-radius: 8px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
}

.refresh-btn:hover { background: rgba(255,255,255,0.2); }

.last-update {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
}

/* ── 메인 ── */
.container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px;
}

/* ── 섹션 타이틀 ── */
.section-title {
    font-size: 15px;
    font-weight: 700;
    color: #555;
    margin-bottom: 14px;
    padding-left: 2px;
}

/* ── 요약 카드 그리드 ── */
.summary-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 28px;
}

.summary-card {
    background: #fff;
    border-radius: 14px;
    padding: 24px;
    border: 1px solid #D9D4CA;
    transition: box-shadow 0.2s;
    position: relative;
    overflow: hidden;
}

.summary-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.06); }

.summary-card .card-icon {
    font-size: 28px;
    margin-bottom: 8px;
}

.summary-card .card-label {
    font-size: 12px;
    font-weight: 600;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
}

.summary-card .card-value {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -1px;
}

.summary-card .card-sub {
    font-size: 12px;
    color: #aaa;
    margin-top: 4px;
}

.summary-card .accent-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
}

/* ── 플랫폼 카드 ── */
.platform-cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
}

.platform-card {
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #D9D4CA;
    transition: box-shadow 0.2s;
}

.platform-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.06); }

.platform-card-header {
    padding: 16px 20px;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.platform-card-header .pf-name {
    font-size: 15px;
    font-weight: 700;
}

.platform-card-header .pf-orders {
    font-size: 22px;
    font-weight: 800;
}

.platform-card-body {
    padding: 18px 20px;
}

.pf-stat {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
}

.pf-stat:not(:last-child) { border-bottom: 1px solid #f0ebe3; }

.pf-stat .pf-stat-label {
    font-size: 12px;
    color: #888;
    font-weight: 500;
}

.pf-stat .pf-stat-value {
    font-size: 14px;
    font-weight: 700;
}

.pf-stat .pf-stat-value.positive { color: #0f9b58; }
.pf-stat .pf-stat-value.negative { color: #e94560; }

/* ── 이번달 바 차트 (CSS) ── */
.month-breakdown {
    background: #fff;
    border-radius: 14px;
    padding: 24px;
    border: 1px solid #D9D4CA;
    margin-bottom: 28px;
}

.bar-chart {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 16px;
}

.bar-row {
    display: flex;
    align-items: center;
    gap: 12px;
}

.bar-label {
    width: 80px;
    font-size: 13px;
    font-weight: 600;
    text-align: right;
    flex-shrink: 0;
}

.bar-track {
    flex: 1;
    height: 32px;
    background: #f5f0e8;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
}

.bar-fill {
    height: 100%;
    border-radius: 8px;
    display: flex;
    align-items: center;
    padding-left: 12px;
    font-size: 12px;
    font-weight: 700;
    color: white;
    min-width: 2px;
    transition: width 0.6s ease;
}

.bar-amount {
    width: 120px;
    font-size: 13px;
    font-weight: 700;
    text-align: right;
    flex-shrink: 0;
}

/* ── 수수료 안내 ── */
.commission-info {
    background: #fff;
    border-radius: 14px;
    padding: 20px 24px;
    border: 1px solid #D9D4CA;
    margin-bottom: 28px;
}

.commission-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-top: 12px;
}

.commission-item {
    text-align: center;
    padding: 12px;
    background: #f9f6f0;
    border-radius: 8px;
}

.commission-item .ci-platform { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.commission-item .ci-rate { font-size: 20px; font-weight: 800; color: #e94560; }
.commission-item .ci-note { font-size: 10px; color: #999; margin-top: 2px; }

/* ── 로딩 ── */
.loading {
    text-align: center;
    padding: 60px 20px;
    color: #999;
}

.loading .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid #e0dbd3;
    border-top-color: #f4a900;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ── 빈 상태 ── */
.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #bbb;
}

.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }

/* ── 토스트 ── */
.toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 14px 24px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    color: white;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.3s;
    z-index: 1000;
}

.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: #0f9b58; }
.toast.error { background: #e94560; }
.toast.info { background: #4285f4; }

/* ── 반응형 ── */
@media (max-width: 1024px) {
    .platform-cards { grid-template-columns: repeat(2, 1fr); }
    .commission-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 640px) {
    .header { padding: 16px; }
    .container { padding: 16px; }
    .summary-cards { grid-template-columns: 1fr; }
    .platform-cards { grid-template-columns: 1fr; }
    .commission-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<!-- 헤더 -->
<div class="header">
    <div>
        <h1>📊 주문관리 <span>대시보드</span></h1>
        <div class="last-update" id="lastUpdate"></div>
    </div>
    <div class="month-nav">
        <button class="nav-btn" onclick="changeMonth(-1)">◀ 이전달</button>
        <div class="month-label" id="monthLabel"></div>
        <button class="nav-btn" onclick="changeMonth(1)">다음달 ▶</button>
        <button class="current-btn" onclick="goCurrentMonth()">이번달</button>
        <button class="refresh-btn" onclick="loadDashboard()">🔄 새로고침</button>
    </div>
</div>

<!-- 메인 -->
<div class="container">
    <!-- 로딩 -->
    <div class="loading" id="loadingState">
        <div class="spinner"></div>
        <div>데이터 불러오는 중...</div>
    </div>

    <!-- 대시보드 콘텐츠 -->
    <div id="dashboardContent" style="display:none;">

        <!-- 어제 요약 -->
        <div class="section-title" id="yesterdayTitle">📅 어제</div>
        <div class="summary-cards" id="yesterdaySummary"></div>

        <!-- 어제 플랫폼별 -->
        <div class="section-title">🏪 플랫폼별 현황</div>
        <div class="platform-cards" id="platformCards"></div>

        <!-- 이번달 요약 -->
        <div class="section-title" id="monthTitle">📆 이번달 요약</div>
        <div class="summary-cards" id="monthSummary"></div>

        <!-- 이번달 플랫폼별 매출 바 -->
        <div class="month-breakdown">
            <div class="section-title" style="margin-bottom:0">📊 이번달 플랫폼별 매출</div>
            <div class="bar-chart" id="monthBarChart"></div>
        </div>

        <!-- 수수료 안내 -->
        <div class="commission-info">
            <div class="section-title" style="margin-bottom:0">💡 플랫폼 수수료율</div>
            <div class="commission-grid">
                <div class="commission-item">
                    <div class="ci-platform" style="color:#00C73C">네이버</div>
                    <div class="ci-rate">5.5%</div>
                </div>
                <div class="commission-item">
                    <div class="ci-platform" style="color:#E31837">쿠팡</div>
                    <div class="ci-rate">11%</div>
                </div>
                <div class="commission-item">
                    <div class="ci-platform" style="color:#35C5F0">오늘의집</div>
                    <div class="ci-rate">0%</div>
                    <div class="ci-note">정산금액 기준</div>
                </div>
                <div class="commission-item">
                    <div class="ci-platform" style="color:#FF6F61">아이디어스</div>
                    <div class="ci-rate">15%</div>
                    <div class="ci-note">+배송비 2,500원/건</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 빈 상태 -->
    <div class="empty-state" id="emptyState" style="display:none;">
        <div class="empty-icon">📦</div>
        <p>아직 주문 데이터가 없어요</p>
        <p style="margin-top:8px; font-size:12px; color:#ccc;">주문서 업로드 후 대시보드가 표시됩니다</p>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Supabase 초기화 ──
const SUPABASE_URL = 'https://hayfpcuacwkytbjwjdhm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhheWZwY3VhY3dreXRiandqZGhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDcwMzE3MjgsImV4cCI6MjA2MjYwNzcyOH0.sb_publishable_OnGhN5iA72Y6H0jmTu82tg_Vv9VJyI7';

let supabase;
try {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
} catch(e) {
    // fallback: key만으로 시도
    supabase = null;
}

// ── 설정 ──
const COMMISSION_RATES = {
    "네이버": 0.055,
    "쿠팡": 0.11,
    "아이디어스": 0.15,
    "오늘의집": 0.0
};

const PLATFORM_COLORS = {
    "네이버": "#00C73C",
    "쿠팡": "#E31837",
    "오늘의집": "#35C5F0",
    "아이디어스": "#FF6F61"
};

const PLATFORMS = ["네이버", "쿠팡", "오늘의집", "아이디어스"];

// ── 날짜 관리 ──
let currentDate = new Date();

function getYesterday() {
    const d = new Date();
    d.setDate(d.getDate() - 1);
    return formatDate(d);
}

function formatDate(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getMonthRange() {
    const y = currentDate.getFullYear();
    const m = currentDate.getMonth();
    const start = `${y}-${String(m+1).padStart(2,'0')}-01`;
    const lastDay = new Date(y, m+1, 0).getDate();
    const end = `${y}-${String(m+1).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
    return { start, end };
}

function updateMonthLabel() {
    document.getElementById('monthLabel').textContent =
        `${currentDate.getFullYear()}년 ${currentDate.getMonth()+1}월`;
}

function changeMonth(dir) {
    currentDate.setMonth(currentDate.getMonth() + dir);
    updateMonthLabel();
    loadDashboard();
}

function goCurrentMonth() {
    currentDate = new Date();
    updateMonthLabel();
    loadDashboard();
}

// ── 숫자 포맷 ──
function fmtNum(n) {
    if (n === null || n === undefined) return '0';
    return Math.round(n).toLocaleString('ko-KR');
}

function fmtWon(n) {
    return fmtNum(n) + '원';
}

// ── 순익 계산 ──
function calcProfit(platform, revenue, costTotal, orderCount) {
    const commissionRate = COMMISSION_RATES[platform] || 0;
    let commission = revenue * commissionRate;

    // 아이디어스: 주문당 배송비 2,500원 추가
    if (platform === '아이디어스') {
        commission += (orderCount || 0) * 2500;
    }

    return revenue - commission - costTotal;
}

// ── 대시보드 로드 ──
async function loadDashboard() {
    const loading = document.getElementById('loadingState');
    const content = document.getElementById('dashboardContent');
    const empty = document.getElementById('emptyState');

    loading.style.display = 'block';
    content.style.display = 'none';
    empty.style.display = 'none';

    try {
        const yesterday = getYesterday();
        const { start: monthStart, end: monthEnd } = getMonthRange();

        // 어제 데이터 조회
        const yesterdayData = await fetchDayData(yesterday);

        // 이번달 데이터 조회
        const monthData = await fetchPeriodData(monthStart, monthEnd);

        // 전체 데이터 존재 여부
        const { count } = await supabase
            .from('orders')
            .select('*', { count: 'exact', head: true });

        loading.style.display = 'none';

        if (!count || count === 0) {
            empty.style.display = 'block';
            return;
        }

        content.style.display = 'block';

        // UI 렌더링
        renderYesterdaySummary(yesterday, yesterdayData);
        renderPlatformCards(yesterday, yesterdayData);
        renderMonthSummary(monthData);
        renderMonthBarChart(monthData);

        // 업데이트 시간
        document.getElementById('lastUpdate').textContent =
            `마지막 업데이트: ${new Date().toLocaleTimeString('ko-KR')}`;

    } catch (err) {
        loading.style.display = 'none';
        console.error('Dashboard load error:', err);

        // 테이블이 없는 경우
        if (err.message && err.message.includes('does not exist')) {
            empty.style.display = 'block';
            showToast('orders 테이블이 없습니다. Supabase에서 SQL을 먼저 실행해주세요.', 'error');
        } else {
            empty.style.display = 'block';
            showToast('데이터 로드 실패: ' + (err.message || err), 'error');
        }
    }
}

// ── 하루 데이터 조회 ──
async function fetchDayData(dateStr) {
    // 주문 데이터
    const { data: orders, error } = await supabase
        .from('orders')
        .select('platform, product, option, quantity, price')
        .eq('order_date', dateStr);

    if (error) throw error;

    // 원가 데이터 (전체)
    const { data: costs } = await supabase
        .from('product_costs')
        .select('platform, product, option, cost');

    const costMap = {};
    (costs || []).forEach(c => {
        costMap[`${c.platform}|${c.product}|${c.option || ''}`] = c.cost || 0;
    });

    // 플랫폼별 집계
    const result = {};
    PLATFORMS.forEach(p => {
        result[p] = { revenue: 0, qty: 0, costTotal: 0, orderCount: 0, orders: new Set() };
    });

    (orders || []).forEach(o => {
        const p = o.platform;
        if (!result[p]) return;

        const amount = (o.price || 0) * (o.quantity || 1);
        const costKey = `${p}|${o.product}|${o.option || ''}`;
        const unitCost = costMap[costKey] || 0;

        result[p].revenue += amount;
        result[p].qty += (o.quantity || 1);
        result[p].costTotal += unitCost * (o.quantity || 1);
        result[p].orderCount++;
    });

    return result;
}

// ── 기간 데이터 조회 ──
async function fetchPeriodData(startDate, endDate) {
    const { data: orders, error } = await supabase
        .from('orders')
        .select('platform, product, option, quantity, price')
        .gte('order_date', startDate)
        .lte('order_date', endDate);

    if (error) throw error;

    const { data: costs } = await supabase
        .from('product_costs')
        .select('platform, product, option, cost');

    const costMap = {};
    (costs || []).forEach(c => {
        costMap[`${c.platform}|${c.product}|${c.option || ''}`] = c.cost || 0;
    });

    const result = {};
    PLATFORMS.forEach(p => {
        result[p] = { revenue: 0, qty: 0, costTotal: 0, orderCount: 0 };
    });

    (orders || []).forEach(o => {
        const p = o.platform;
        if (!result[p]) return;

        const amount = (o.price || 0) * (o.quantity || 1);
        const costKey = `${p}|${o.product}|${o.option || ''}`;
        const unitCost = costMap[costKey] || 0;

        result[p].revenue += amount;
        result[p].qty += (o.quantity || 1);
        result[p].costTotal += unitCost * (o.quantity || 1);
        result[p].orderCount++;
    });

    return result;
}

// ── 어제 요약 렌더링 ──
function renderYesterdaySummary(dateStr, data) {
    const d = new Date(dateStr + 'T00:00:00');
    const label = `${d.getMonth()+1}/${d.getDate()}`;
    document.getElementById('yesterdayTitle').textContent = `📅 어제 (${label})`;

    let totalRevenue = 0, totalProfit = 0, totalQty = 0;

    PLATFORMS.forEach(p => {
        const d = data[p];
        totalRevenue += d.revenue;
        totalProfit += calcProfit(p, d.revenue, d.costTotal, d.orderCount);
        totalQty += d.qty;
    });

    const container = document.getElementById('yesterdaySummary');
    container.innerHTML = `
        <div class="summary-card">
            <div class="accent-bar" style="background:#4285f4;"></div>
            <div class="card-icon">💰</div>
            <div class="card-label">매출</div>
            <div class="card-value" style="color:#4285f4;">${fmtWon(totalRevenue)}</div>
        </div>
        <div class="summary-card">
            <div class="accent-bar" style="background:${totalProfit >= 0 ? '#0f9b58' : '#e94560'};"></div>
            <div class="card-icon">📈</div>
            <div class="card-label">순익</div>
            <div class="card-value" style="color:${totalProfit >= 0 ? '#0f9b58' : '#e94560'};">${fmtWon(totalProfit)}</div>
            <div class="card-sub">수수료 + 원가 차감 후</div>
        </div>
        <div class="summary-card">
            <div class="accent-bar" style="background:#9b59b6;"></div>
            <div class="card-icon">📦</div>
            <div class="card-label">주문</div>
            <div class="card-value" style="color:#9b59b6;">${fmtNum(totalQty)}건</div>
        </div>
    `;
}

// ── 플랫폼별 카드 렌더링 ──
function renderPlatformCards(dateStr, data) {
    const container = document.getElementById('platformCards');
    container.innerHTML = '';

    PLATFORMS.forEach(p => {
        const d = data[p];
        const profit = calcProfit(p, d.revenue, d.costTotal, d.orderCount);
        const commission = d.revenue * (COMMISSION_RATES[p] || 0) +
            (p === '아이디어스' ? d.orderCount * 2500 : 0);
        const profitClass = profit >= 0 ? 'positive' : 'negative';

        container.innerHTML += `
            <div class="platform-card">
                <div class="platform-card-header" style="background:${PLATFORM_COLORS[p]};">
                    <span class="pf-name">${p}</span>
                    <span class="pf-orders">${fmtNum(d.qty)}건</span>
                </div>
                <div class="platform-card-body">
                    <div class="pf-stat">
                        <span class="pf-stat-label">매출</span>
                        <span class="pf-stat-value">${fmtWon(d.revenue)}</span>
                    </div>
                    <div class="pf-stat">
                        <span class="pf-stat-label">수수료</span>
                        <span class="pf-stat-value negative">-${fmtWon(commission)}</span>
                    </div>
                    <div class="pf-stat">
                        <span class="pf-stat-label">원가</span>
                        <span class="pf-stat-value negative">-${fmtWon(d.costTotal)}</span>
                    </div>
                    <div class="pf-stat">
                        <span class="pf-stat-label">순익</span>
                        <span class="pf-stat-value ${profitClass}">${fmtWon(profit)}</span>
                    </div>
                </div>
            </div>
        `;
    });
}

// ── 이번달 요약 렌더링 ──
function renderMonthSummary(data) {
    const { start, end } = getMonthRange();
    const m = currentDate.getMonth() + 1;
    document.getElementById('monthTitle').textContent =
        `📆 ${currentDate.getFullYear()}년 ${m}월 요약`;

    let totalRevenue = 0, totalProfit = 0, totalQty = 0;

    PLATFORMS.forEach(p => {
        const d = data[p];
        totalRevenue += d.revenue;
        totalProfit += calcProfit(p, d.revenue, d.costTotal, d.orderCount);
        totalQty += d.qty;
    });

    const container = document.getElementById('monthSummary');
    container.innerHTML = `
        <div class="summary-card">
            <div class="accent-bar" style="background:#4285f4;"></div>
            <div class="card-icon">💰</div>
            <div class="card-label">${m}월 매출</div>
            <div class="card-value" style="color:#4285f4;">${fmtWon(totalRevenue)}</div>
        </div>
        <div class="summary-card">
            <div class="accent-bar" style="background:${totalProfit >= 0 ? '#0f9b58' : '#e94560'};"></div>
            <div class="card-icon">📈</div>
            <div class="card-label">${m}월 순익</div>
            <div class="card-value" style="color:${totalProfit >= 0 ? '#0f9b58' : '#e94560'};">${fmtWon(totalProfit)}</div>
        </div>
        <div class="summary-card">
            <div class="accent-bar" style="background:#9b59b6;"></div>
            <div class="card-icon">📦</div>
            <div class="card-label">${m}월 주문</div>
            <div class="card-value" style="color:#9b59b6;">${fmtNum(totalQty)}건</div>
        </div>
    `;
}

// ── 이번달 바 차트 렌더링 ──
function renderMonthBarChart(data) {
    const container = document.getElementById('monthBarChart');

    const revenues = PLATFORMS.map(p => data[p].revenue);
    const maxRevenue = Math.max(...revenues, 1);

    container.innerHTML = PLATFORMS.map(p => {
        const d = data[p];
        const pct = Math.round((d.revenue / maxRevenue) * 100);
        const profit = calcProfit(p, d.revenue, d.costTotal, d.orderCount);

        return `
            <div class="bar-row">
                <div class="bar-label" style="color:${PLATFORM_COLORS[p]}">${p}</div>
                <div class="bar-track">
                    <div class="bar-fill" style="width:${Math.max(pct, 1)}%; background:${PLATFORM_COLORS[p]};">
                        ${pct > 15 ? fmtWon(d.revenue) : ''}
                    </div>
                </div>
                <div class="bar-amount" style="color:${profit >= 0 ? '#0f9b58' : '#e94560'};">
                    순익 ${fmtWon(profit)}
                </div>
            </div>
        `;
    }).join('');
}

// ── 토스트 ──
function showToast(msg, type = 'info') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast ' + type + ' show';
    setTimeout(() => el.classList.remove('show'), 3000);
}

// ── 초기화 ──
document.addEventListener('DOMContentLoaded', () => {
    updateMonthLabel();

    if (!supabase) {
        // Supabase 연결 실패 시 수동 초기화 시도
        try {
            const { createClient } = window.supabase;
            supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch(e) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('emptyState').style.display = 'block';
            showToast('Supabase 연결 실패', 'error');
            return;
        }
    }

    loadDashboard();
});
</script>
