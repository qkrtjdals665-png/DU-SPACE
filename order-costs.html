<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주문관리 - 상품 원가 관리</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:#EDE8DF;min-height:100vh;}
.header{background:#1a1a2e;color:white;padding:20px 32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.header h1{font-size:20px;font-weight:700;}.header h1 span{color:#f4a900;}
.nav-links{display:flex;gap:8px;}
.nav-links a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:13px;padding:8px 16px;border-radius:8px;background:rgba(255,255,255,0.1);}
.container{max-width:1400px;margin:0 auto;padding:24px;}
.month-nav{display:flex;align-items:center;gap:8px;background:#fff;padding:14px 20px;border-radius:14px;border:1px solid #D9D4CA;margin-bottom:16px;}
.month-nav button{padding:8px 18px;border:none;border-radius:8px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
.month-nav .nav-btn{background:#f5f0e8;color:#555;}.month-nav .current-btn{background:#f4a900;color:#1a1a2e;}
.month-label{font-size:18px;font-weight:700;min-width:140px;text-align:center;}
.summary-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:16px;}
.sc{background:#fff;border-radius:14px;padding:16px;border:1px solid #D9D4CA;text-align:center;}
.sc .sc-label{font-size:11px;color:#888;font-weight:600;margin-bottom:4px;}
.sc .sc-value{font-size:18px;font-weight:800;}
.filter-bar{background:#fff;border-radius:14px;padding:14px 24px;border:1px solid #D9D4CA;margin-bottom:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.filter-bar select,.filter-bar input{padding:7px 12px;border:1.5px solid #D9D4CA;border-radius:8px;font-family:'Noto Sans KR',sans-serif;font-size:13px;}
.filter-bar select:focus,.filter-bar input:focus{outline:none;border-color:#f4a900;}
.btn{padding:7px 16px;border:none;border-radius:8px;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.btn-primary{background:#1a1a2e;color:white;}
.btn-success{background:#0f9b58;color:white;}
.btn-danger{background:#e94560;color:white;}
.btn-warn{background:#f4a900;color:#1a1a2e;}
.delete-bar{background:#fff;border-radius:14px;padding:12px 24px;border:1px solid #D9D4CA;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.delete-bar span{font-size:12px;color:#e94560;font-weight:600;}
.table-section{background:#fff;border-radius:14px;padding:16px;border:1px solid #D9D4CA;overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{background:#f5f0e8;padding:9px 5px;text-align:center;font-weight:600;color:#555;border-bottom:2px solid #D9D4CA;white-space:nowrap;font-size:11px;}
tbody td{padding:7px 5px;border-bottom:1px solid #f0ebe3;text-align:center;}
tbody tr:hover td{background:#faf8f4;}
.platform-badge{display:inline-block;padding:3px 8px;border-radius:12px;font-size:10px;font-weight:700;color:white;}
.editable{padding:5px 6px;border:1.5px solid #D9D4CA;border-radius:6px;font-family:'Noto Sans KR',sans-serif;font-size:12px;text-align:right;width:75px;}
.editable:focus{outline:none;border-color:#f4a900;background:#fffbf0;}
.editable.changed{border-color:#0f9b58;background:#f0faf4;}
.text-left{text-align:left;}
.text-right{text-align:right;}
.amount{font-variant-numeric:tabular-nums;font-weight:600;}
.no-cost{border-color:#e94560;}
.has-cost{border-color:#0f9b58;}
.del-btn{background:none;border:none;color:#ddd;cursor:pointer;font-size:15px;padding:2px 6px;border-radius:4px;}
.del-btn:hover{color:#e94560;background:#fef0f3;}
input[type="checkbox"]{width:15px;height:15px;accent-color:#f4a900;cursor:pointer;}
.change-count{font-size:12px;color:#f4a900;font-weight:600;margin-left:auto;}
.toast{position:fixed;bottom:24px;right:24px;padding:14px 24px;border-radius:10px;font-size:13px;font-weight:600;color:white;opacity:0;transform:translateY(20px);transition:all 0.3s;z-index:1000;}
.toast.show{opacity:1;transform:translateY(0);}.toast.success{background:#0f9b58;}.toast.error{background:#e94560;}.toast.info{background:#4285f4;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;justify-content:center;align-items:center;}
.modal-overlay.show{display:flex;}
.modal{background:#fff;border-radius:16px;padding:32px;max-width:440px;width:90%;text-align:center;}
.modal h3{font-size:18px;margin-bottom:12px;color:#e94560;}
.modal p{font-size:13px;color:#666;line-height:1.7;margin-bottom:16px;}
.modal .modal-count{font-size:28px;font-weight:800;color:#e94560;margin:10px 0;}
.modal-btns{display:flex;gap:12px;justify-content:center;}
.modal-btns button{padding:12px 28px;border:none;border-radius:10px;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:700;cursor:pointer;}
@media(max-width:768px){.summary-cards{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<div class="header">
    <h1>💰 상품 <span>원가 관리</span></h1>
    <div class="nav-links"><a href="order-dashboard.html">📊 대시보드</a><a href="order-daily.html">📈 일별매출</a></div>
</div>
<div class="container">
    <div class="month-nav">
        <button class="nav-btn" onclick="changeMonth(-1)">◀ 이전달</button>
        <div class="month-label" id="monthLabel"></div>
        <button class="nav-btn" onclick="changeMonth(1)">다음달 ▶</button>
        <button class="current-btn" onclick="goCurrentMonth()">이번달</button>
    </div>
    <div class="summary-cards" id="summaryCards"></div>
    <div class="filter-bar">
        <select id="filterPlatform" onchange="loadCosts()"><option value="전체">전체 플랫폼</option><option value="네이버">네이버</option><option value="쿠팡">쿠팡</option><option value="오늘의집">오늘의집</option><option value="아이디어스">아이디어스</option></select>
        <select id="filterCostStatus" onchange="loadCosts()"><option value="전체">전체</option><option value="미입력">❌ 원가 미입력</option><option value="입력완료">✅ 입력 완료</option></select>
        <input type="text" id="filterSearch" placeholder="상품명 검색" style="width:150px;" onkeydown="if(event.key==='Enter')loadCosts()">
        <button class="btn btn-primary" onclick="loadCosts()">🔍 조회</button>
        <button class="btn btn-success" onclick="saveAllChanges()">💾 변경사항 저장</button>
        <span class="change-count" id="changeCount"></span>
    </div>
    <div class="delete-bar">
        <span>🗑 삭제:</span>
        <button class="btn btn-danger" style="font-size:11px;padding:5px 12px;" onclick="deleteSelected()">선택 삭제</button>
        <button class="btn btn-warn" style="font-size:11px;padding:5px 12px;" onclick="deleteByPlatform()">플랫폼별 삭제</button>
        <button class="btn btn-danger" style="font-size:11px;padding:5px 12px;" onclick="deleteAllCosts()">⚠️ 전체 삭제</button>
    </div>
    <div class="table-section">
        <table>
            <thead><tr>
                <th style="width:28px"><input type="checkbox" id="checkAll" onchange="toggleAll()"></th>
                <th>No</th><th>플랫폼</th>
                <th class="text-left" style="min-width:200px;">상품명</th>
                <th class="text-left" style="min-width:120px;">옵션</th>
                <th>원가</th><th>판매가</th><th>개당순익</th><th>이익률</th>
                <th>판매수량</th><th>월매출</th><th>월순익</th><th>삭제</th>
            </tr></thead>
            <tbody id="costBody"><tr><td colspan="13" style="text-align:center;color:#ccc;padding:40px;">로딩 중...</td></tr></tbody>
        </table>
    </div>
</div>

<div class="modal-overlay" id="deleteModal">
    <div class="modal">
        <h3>⚠️ 삭제 확인</h3>
        <p id="deleteMsg"></p>
        <div class="modal-count" id="deleteCount"></div>
        <p style="font-size:12px;color:#e94560;">이 작업은 되돌릴 수 없습니다!</p>
        <div class="modal-btns">
            <button onclick="closeModal()" style="background:#f0ebe3;color:#666;">취소</button>
            <button id="deleteConfirmBtn" style="background:#e94560;color:white;">삭제</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>
<script>
const SUPABASE_URL='https://hayfpcuacwkytbjwjdhm.supabase.co';
const SUPABASE_KEY='sb_publishable_OnGhN5iA72Y6H0jmTu82tg_Vv9VJyI7';
const {createClient}=window.supabase;
const db=createClient(SUPABASE_URL,SUPABASE_KEY);
const PFC={"네이버":"#00C73C","쿠팡":"#E31837","오늘의집":"#35C5F0","아이디어스":"#FF6F61"};
const CR={"네이버":0.055,"쿠팡":0.11,"아이디어스":0.15,"오늘의집":0};

let currentDate=new Date(),allCosts=[],changes={},salesData={};

function updateMonthLabel(){document.getElementById('monthLabel').textContent=`${currentDate.getFullYear()}년 ${currentDate.getMonth()+1}월`;}
function changeMonth(dir){currentDate.setMonth(currentDate.getMonth()+dir);updateMonthLabel();loadCosts();}
function goCurrentMonth(){currentDate=new Date();updateMonthLabel();loadCosts();}
function getMonthRange(){
    const y=currentDate.getFullYear(),m=currentDate.getMonth();
    return{start:`${y}-${String(m+1).padStart(2,'0')}-01`,end:`${y}-${String(m+1).padStart(2,'0')}-${String(new Date(y,m+1,0).getDate()).padStart(2,'0')}`};
}

async function loadCosts(){
    changes={};updateChangeCount();
    const pf=document.getElementById('filterPlatform').value;
    const st=document.getElementById('filterCostStatus').value;
    const search=document.getElementById('filterSearch').value.trim();
    const {start:ms,end:me}=getMonthRange();

    // 페이지네이션 함수
    async function fetchAll(table, select, filters={}){
        const PAGE=1000; let all=[], from=0;
        while(true){
            let q=db.from(table).select(select);
            if(filters.eq) filters.eq.forEach(f=>q=q.eq(f[0],f[1]));
            if(filters.gte) filters.gte.forEach(f=>q=q.gte(f[0],f[1]));
            if(filters.lte) filters.lte.forEach(f=>q=q.lte(f[0],f[1]));
            if(filters.ilike) filters.ilike.forEach(f=>q=q.ilike(f[0],f[1]));
            if(filters.order) filters.order.forEach(f=>q=q.order(f));
            const {data}=await q.range(from,from+PAGE-1);
            if(!data||!data.length) break;
            all=all.concat(data);
            if(data.length<PAGE) break;
            from+=PAGE;
        }
        return all;
    }

    const costFilters={order:['platform','product']};
    if(pf!=='전체')costFilters.eq=[['platform',pf]];
    if(search)costFilters.ilike=[['product',`%${search}%`]];
    const costs=await fetchAll('product_costs','*',costFilters);
    if(!costs){showToast('로드 실패','error');return;}

    // 해당 월 판매
    const mo=await fetchAll('orders','platform,product,option,quantity,price',{gte:[['order_date',ms]],lte:[['order_date',me]]});
    salesData={};
    (mo||[]).forEach(o=>{const k=`${o.platform}|${o.product}|${o.option||''}`;if(!salesData[k])salesData[k]={qty:0,revenue:0};salesData[k].qty+=(o.quantity||1);salesData[k].revenue+=(o.price||0)*(o.quantity||1);});

    // 판매가 자동 입력
    const ao=await fetchAll('orders','platform,product,option,price');
    const ap={};(ao||[]).forEach(o=>{const k=`${o.platform}|${o.product}|${o.option||''}`;if(!ap[k])ap[k]=[];if(o.price>0)ap[k].push(o.price);});
    const au=[];
    (costs||[]).forEach(c=>{
        if(!c.selling_price||c.selling_price===0){
            const k=`${c.platform}|${c.product}|${c.option||''}`,prices=ap[k];
            if(prices&&prices.length>0){
                const pc={};prices.forEach(p=>{const rp=Math.round(p);pc[rp]=(pc[rp]||0)+1;});
                const tp=Number(Object.entries(pc).sort((a,b)=>b[1]-a[1])[0][0]);
                au.push({id:c.id,selling_price:tp});c.selling_price=tp;
            }
        }
    });
    if(au.length>0){for(const u of au)await db.from('product_costs').update({selling_price:u.selling_price}).eq('id',u.id);showToast(`판매가 ${au.length}개 자동 입력!`,'success');}

    let filtered=costs||[];
    if(st==='미입력')filtered=filtered.filter(c=>!c.cost||c.cost===0);
    else if(st==='입력완료')filtered=filtered.filter(c=>c.cost>0);
    allCosts=filtered;
    renderTable();renderSummary(costs||[]);
}

function renderTable(){
    const tbody=document.getElementById('costBody');
    if(!allCosts.length){tbody.innerHTML='<tr><td colspan="13" style="text-align:center;color:#ccc;padding:40px;">상품이 없습니다</td></tr>';return;}
    tbody.innerHTML=allCosts.map((c,i)=>{
        const k=`${c.platform}|${c.product}|${c.option||''}`,s=salesData[k]||{qty:0,revenue:0};
        const cost=c.cost||0,sp=c.selling_price||0,cr=CR[c.platform]||0;
        const up=sp>0?(sp-sp*cr-cost):0;
        const margin=sp>0?((up/sp)*100).toFixed(1):'–';
        const mRev=s.revenue,mProfit=mRev-mRev*cr-(cost*s.qty);
        const costClass=cost>0?'has-cost':'no-cost';
        const upc=up>0?'#0f9b58':up<0?'#e94560':'#888';
        const mpc=mProfit>0?'#0f9b58':mProfit<0?'#e94560':'#888';
        const mgc=Number(margin)>30?'#0f9b58':Number(margin)>0?'#f4a900':'#e94560';
        return `<tr>
            <td><input type="checkbox" class="cost-check" value="${c.id}"></td>
            <td style="color:#aaa;font-size:10px;">${i+1}</td>
            <td><span class="platform-badge" style="background:${PFC[c.platform]||'#999'}">${c.platform}</span></td>
            <td class="text-left" title="${c.product}" style="font-size:11px;">${(c.product||'').substring(0,32)}</td>
            <td class="text-left" title="${c.option||''}" style="font-size:10px;color:#666;">${(c.option||'').substring(0,18)||'-'}</td>
            <td><input class="editable ${costClass}" type="text" value="${cost?Math.round(cost).toLocaleString():''}" placeholder="0" data-id="${c.id}" data-field="cost" onchange="onEdit(this)" onfocus="this.select()"></td>
            <td><input class="editable" type="text" value="${sp?Math.round(sp).toLocaleString():''}" placeholder="0" data-id="${c.id}" data-field="selling_price" onchange="onEdit(this)" onfocus="this.select()"></td>
            <td style="font-weight:700;color:${upc};font-size:11px;">${cost>0&&sp>0?Math.round(up).toLocaleString()+'원':'–'}</td>
            <td style="font-weight:600;color:${mgc};font-size:11px;">${margin!=='–'?margin+'%':'–'}</td>
            <td style="font-size:11px;">${s.qty>0?s.qty.toLocaleString()+'개':'-'}</td>
            <td class="text-right amount" style="font-size:11px;">${s.qty>0?Math.round(mRev).toLocaleString()+'원':'-'}</td>
            <td class="text-right amount" style="color:${mpc};font-size:11px;">${s.qty>0?Math.round(mProfit).toLocaleString()+'원':'-'}</td>
            <td><button class="del-btn" onclick="deleteSingle(${c.id})" title="삭제">✕</button></td>
        </tr>`;
    }).join('');
}

function onEdit(input){
    const id=Number(input.dataset.id),field=input.dataset.field;
    const val=Number(input.value.replace(/[^\d]/g,''))||0;
    input.value=val>0?val.toLocaleString():'';
    input.classList.add('changed');
    if(!changes[id])changes[id]={};
    changes[id][field]=val;
    updateChangeCount();
}
function updateChangeCount(){const n=Object.keys(changes).length;document.getElementById('changeCount').textContent=n>0?`⚠️ ${n}개 변경됨 — 저장 필요!`:'';}
function toggleAll(){const c=document.getElementById('checkAll').checked;document.querySelectorAll('.cost-check').forEach(cb=>cb.checked=c);}

async function saveAllChanges(){
    const ids=Object.keys(changes);
    if(!ids.length){showToast('변경사항 없음','info');return;}
    let saved=0;
    for(const id of ids){const{error}=await db.from('product_costs').update(changes[id]).eq('id',Number(id));if(!error)saved++;}
    changes={};updateChangeCount();
    document.querySelectorAll('.editable.changed').forEach(el=>el.classList.remove('changed'));
    showToast(`${saved}개 저장 완료!`,'success');
    loadCosts();
}

// ── 삭제: 개별 ──
async function deleteSingle(id){
    showDeleteModal('이 상품 원가를 삭제합니다.','1건',async()=>{
        await db.from('product_costs').delete().eq('id',id);
        showToast('삭제됨','success');loadCosts();
    });
}

// ── 삭제: 선택 ──
async function deleteSelected(){
    const ids=[...document.querySelectorAll('.cost-check:checked')].map(cb=>Number(cb.value));
    if(!ids.length){showToast('삭제할 항목을 선택해주세요','info');return;}
    showDeleteModal('선택한 상품 원가를 삭제합니다.',ids.length+'건',async()=>{
        for(const id of ids) await db.from('product_costs').delete().eq('id',id);
        showToast(`${ids.length}건 삭제 완료`,'success');
        document.getElementById('checkAll').checked=false;
        loadCosts();
    });
}

// ── 삭제: 플랫폼별 ──
async function deleteByPlatform(){
    const pf=document.getElementById('filterPlatform').value;
    if(pf==='전체'){showToast('플랫폼을 먼저 선택해주세요','info');return;}
    const{count}=await db.from('product_costs').select('*',{count:'exact',head:true}).eq('platform',pf);
    showDeleteModal(`[${pf}] 원가 데이터를 삭제합니다.`,count+'건',async()=>{
        await db.from('product_costs').delete().eq('platform',pf);
        showToast(`${pf} ${count}건 삭제 완료`,'success');loadCosts();
    });
}

// ── 삭제: 전체 ──
async function deleteAllCosts(){
    const{count}=await db.from('product_costs').select('*',{count:'exact',head:true});
    showDeleteModal('⚠️ 모든 상품 원가 데이터를 삭제합니다.',count+'건',async()=>{
        await db.from('product_costs').delete().neq('id',0);
        showToast(`전체 ${count}건 삭제 완료`,'success');loadCosts();
    });
}

// ── 모달 ──
function showDeleteModal(msg,cnt,onConfirm){
    document.getElementById('deleteMsg').textContent=msg;
    document.getElementById('deleteCount').textContent=cnt;
    document.getElementById('deleteModal').classList.add('show');
    document.getElementById('deleteConfirmBtn').onclick=()=>{closeModal();onConfirm();};
}
function closeModal(){document.getElementById('deleteModal').classList.remove('show');}

function renderSummary(allData){
    const m=currentDate.getMonth()+1,t=allData.length,hp=allData.filter(c=>c.cost>0).length,np=t-hp;
    let mRev=0,mProfit=0;
    allData.forEach(c=>{const k=`${c.platform}|${c.product}|${c.option||''}`,s=salesData[k]||{qty:0,revenue:0};mRev+=s.revenue;mProfit+=s.revenue-s.revenue*(CR[c.platform]||0)-((c.cost||0)*s.qty);});
    document.getElementById('summaryCards').innerHTML=`
        <div class="sc"><div class="sc-label">전체 상품</div><div class="sc-value">${t}개</div></div>
        <div class="sc"><div class="sc-label">원가 입력</div><div class="sc-value" style="color:#0f9b58">${hp}개</div></div>
        <div class="sc"><div class="sc-label">미입력</div><div class="sc-value" style="color:${np>0?'#e94560':'#0f9b58'}">${np}개</div></div>
        <div class="sc"><div class="sc-label">${m}월 매출</div><div class="sc-value" style="color:#4285f4">${Math.round(mRev).toLocaleString()}</div></div>
        <div class="sc"><div class="sc-label">${m}월 순익</div><div class="sc-value" style="color:${mProfit>=0?'#0f9b58':'#e94560'}">${Math.round(mProfit).toLocaleString()}</div></div>`;
}

function showToast(msg,type='info'){const el=document.getElementById('toast');el.textContent=msg;el.className='toast '+type+' show';setTimeout(()=>el.classList.remove('show'),3000);}
if(window.self!==window.top){document.querySelectorAll('.header').forEach(el=>el.style.display='none');const c=document.querySelector('.container');if(c)c.style.paddingTop='12px';}
document.addEventListener('DOMContentLoaded',()=>{updateMonthLabel();loadCosts();});
</script>
</body>
</html>
